name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1"  # Monday 06:27 UTC

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, go]
    steps:
      - uses: actions/checkout@v6

      # Go needs an explicit toolchain set up before init() so the
      # CodeQL extractor can resolve module dependencies. The version
      # tracks the go.mod's `go` directive in packages/wolf/coredns-nsec3sign.
      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/wolf/coredns-nsec3sign/go.mod

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # The Go module lives under packages/wolf/coredns-nsec3sign; autobuild
      # from repo root would no-op. Build explicitly so the extractor
      # captures the call graph. GOWORK=off mirrors the CI shard for this
      # module — it's intentionally not in the repo-root go.work because
      # its coredns transitive deps would slow the other Go shards.
      - if: matrix.language == 'go'
        working-directory: packages/wolf/coredns-nsec3sign
        env:
          GOWORK: "off"
        run: go build ./...

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
