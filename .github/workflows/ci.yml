name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  otter:
    name: otter (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/otter
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python + project deps
        run: |
          uv python install 3.12
          uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Tests (pytest)
        run: uv run pytest -q

  mole:
    name: mole (ruff, deprecated)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mole
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python + project deps
        run: |
          uv python install 3.12
          uv sync --extra dev || uv sync

      - name: Lint (ruff)
        run: uv run ruff check . || echo "::warning::ruff check skipped — no rules configured"

  finch:
    name: finch (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/finch
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/finch/package-lock.json

      - name: Install (npm ci if lockfile, else npm install)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        # Held to a "report only" status while the codebase finishes Phase-1
        # cleanup; tests + build are the real gate.
        continue-on-error: true
        run: npx tsc --noEmit -p tsconfig.json

      - name: Tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

  go:
    name: Go ${{ matrix.pkg }} (build + vet + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [badger, heron, magpie, beagle]
    defaults:
      run:
        working-directory: packages/${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          # Matches the toolchain version in each packages/<animal>/go.mod.
          go-version: '1.22'
          # Cache derived from the per-package go.sum so each matrix shard
          # gets its own warm cache without cross-contamination.
          cache-dependency-path: packages/${{ matrix.pkg }}/go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  wolf-coredns-nsec3sign:
    name: wolf/coredns-nsec3sign (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/wolf/coredns-nsec3sign
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: packages/wolf/coredns-nsec3sign/go.sum

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

  container-build:
    name: Container images build (Podman/Buildah)
    runs-on: ubuntu-latest
    needs: [otter, finch, go]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Self-contained services (build context = the package dir).
          - { image: dcim-otter,  context: packages/otter,  containerfile: packages/otter/Containerfile }
          - { image: dcim-finch,  context: packages/finch,  containerfile: packages/finch/Containerfile }
          - { image: dcim-mole,   context: packages/mole,   containerfile: packages/mole/Containerfile }
          - { image: dcim-badger, context: packages/badger, containerfile: packages/badger/Containerfile }
          # Go services that import packages/shared-go via an in-tree
          # replace directive — build context must be repo root so the
          # COPY of packages/shared-go resolves.
          - { image: dcim-heron,  context: .,               containerfile: packages/heron/Containerfile }
          - { image: dcim-magpie, context: .,               containerfile: packages/magpie/Containerfile }
          - { image: dcim-beagle, context: .,               containerfile: packages/beagle/Containerfile }
    steps:
      - uses: actions/checkout@v6

      - name: Build ${{ matrix.image }}
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ matrix.image }}
          tags: ci
          context: ./${{ matrix.context }}
          containerfiles: ./${{ matrix.containerfile }}

  helm:
    name: Helm chart lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.0

      - name: helm lint
        run: helm lint deploy/helm/dcim

      # Render both value sets and pipe through `kubectl apply --dry-run`
      # so we catch malformed YAML / invalid manifests before they hit
      # a real cluster. We don't have a persistent k3d in CI; the full
      # install drill is documented in docs/DEPLOYMENT.md.
      - name: helm template (default values)
        run: helm template dcim deploy/helm/dcim > /tmp/dcim-default.yaml

      - name: helm template (k3d values)
        run: |
          helm template dcim deploy/helm/dcim \
            -f deploy/helm/dcim/values-k3d.yaml > /tmp/dcim-k3d.yaml

      - name: kubectl client-side dry-run
        run: |
          # Install kubectl just for the validation step.
          curl -sSLo /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          kubectl apply --dry-run=client -f /tmp/dcim-default.yaml > /dev/null
          kubectl apply --dry-run=client -f /tmp/dcim-k3d.yaml > /dev/null

  migrations:
    name: Alembic up / down / up
    runs-on: ubuntu-latest
    services:
      postgres:
        # TimescaleDB-enabled Postgres so migrations that
        # CREATE EXTENSION timescaledb (e.g. the raw_samples hypertable)
        # don't fail in CI.
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: dcim
          POSTGRES_PASSWORD: dcim
          POSTGRES_DB: dcim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dcim -d dcim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: packages/otter
    env:
      # asyncpg driver, points at the service container.
      DCIM_POSTGRES_DSN: postgresql+asyncpg://dcim:dcim@localhost:5432/dcim
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python + project deps
        run: |
          uv python install 3.12
          uv sync

      - name: Apply all migrations from a clean DB
        run: uv run alembic upgrade head

      - name: Step back one revision
        run: uv run alembic downgrade -1

      - name: Re-apply head — confirms downgrade is reversible
        run: uv run alembic upgrade head
