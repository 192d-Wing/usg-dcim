name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # container-build pushes to ghcr.io on main; requires packages:write.
  # On PRs the push step is skipped and the broader permission is unused.
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finch:
    name: finch (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/finch
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/finch/package-lock.json

      - name: Install (npm ci if lockfile, else npm install)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        # Held to a "report only" status while the codebase finishes Phase-1
        # cleanup; tests + build are the real gate.
        continue-on-error: true
        run: npx tsc --noEmit -p tsconfig.json

      - name: Tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

  go:
    name: Go ${{ matrix.pkg }} (build + vet + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [badger, heron, magpie, beagle, otter-go, loadgen]
    defaults:
      run:
        working-directory: packages/${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # Matches the toolchain in go.work; setup-go v6 defaults
          # GOTOOLCHAIN=local, so this must satisfy go.work's go directive.
          go-version: '1.25.7'
          # Cache derived from the per-package go.sum so each matrix shard
          # gets its own warm cache without cross-contamination.
          cache-dependency-path: packages/${{ matrix.pkg }}/go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  # sqlc-drift was retired here. The job's gate was waiting on an
  # alembic schema dump (packages/otter-go/db/schema.sql) that never
  # landed; after the alembic→goose cutover (PR #277) the dump path
  # is gone entirely. The drop-in replacement is a Postgres service
  # container that runs `go run ./cmd/otter-go-migrate -cmd up`,
  # `pg_dump`s the schema, and runs `sqlc generate` against that —
  # but locking that down requires also regenerating every committed
  # db/generated/*.sql.go file with current sqlc, which produces a
  # very large diff that wants its own focused PR. Tracked as a
  # follow-up. Until that lands, sqlc validation lives in the dev
  # workflow only (run `task otter-go:sqlc` before committing query
  # changes); CI no longer pretends to catch drift.

  wolf-coredns-nsec3sign:
    name: wolf/coredns-nsec3sign (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/wolf/coredns-nsec3sign
        # wolf/coredns-nsec3sign isn't listed in the repo-root go.work
        # because its coredns transitive deps are large and slow the
        # other Go shards. Build it as a standalone module instead.
        shell: bash
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
          cache-dependency-path: packages/wolf/coredns-nsec3sign/go.sum

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

  container-build:
    name: Container images build (Podman/Buildah)
    runs-on: ubuntu-latest
    needs: [finch, go]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Self-contained services (build context = the package dir).
          - { image: dcim-finch,  context: packages/finch,  containerfile: packages/finch/Containerfile }
          - { image: dcim-badger, context: packages/badger, containerfile: packages/badger/Containerfile }
          # Go services that import packages/shared-go via an in-tree
          # replace directive — build context must be repo root so the
          # COPY of packages/shared-go resolves. The dcim-otter-go image
          # is multi-binary (otter-go HTTP server + scheduler + worker
          # + migrate); helm chooses the entrypoint per pod, so a Helm
          # release pins a single image tag for every otter-go deployment.
          - { image: dcim-heron,  context: .,               containerfile: packages/heron/Containerfile }
          - { image: dcim-magpie, context: .,               containerfile: packages/magpie/Containerfile }
          - { image: dcim-beagle, context: .,               containerfile: packages/beagle/Containerfile }
          - { image: dcim-otter-go, context: .,             containerfile: packages/otter-go/Containerfile }
    steps:
      - uses: actions/checkout@v6

      - name: Build ${{ matrix.image }}
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ matrix.image }}
          # On main: tag the commit SHA and `latest` so deploys can pin.
          # On PRs: tag only `ci` for build-only validation.
          tags: >-
            ${{ github.ref == 'refs/heads/main'
                && format('latest {0}', github.sha)
                || 'ci' }}
          context: ./${{ matrix.context }}
          containerfiles: ./${{ matrix.containerfile }}

      # Push happens only on pushes to main. PRs from forks won't have
      # packages:write anyway, so the conditional double-protects.
      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.image }} to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io/192d-wing

  helm:
    name: Helm chart lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.0

      - name: helm lint
        run: helm lint deploy/helm/dcim

      # Render both value sets and pipe through `kubectl apply --dry-run`
      # so we catch malformed YAML / invalid manifests before they hit
      # a real cluster. We don't have a persistent k3d in CI; the full
      # install drill is documented in docs/DEPLOYMENT.md.
      - name: helm template (default values)
        run: helm template dcim deploy/helm/dcim > /tmp/dcim-default.yaml

      - name: helm template (k3d values)
        run: |
          helm template dcim deploy/helm/dcim \
            -f deploy/helm/dcim/values-k3d.yaml > /tmp/dcim-k3d.yaml

      - name: Validate rendered manifests with kubeconform
        run: |
          # kubeconform is offline: it ships its own copy of the
          # upstream OpenAPI schemas, so it works without an apiserver.
          # Replaces the old `kubectl apply --dry-run=client` step,
          # which still tries to hit the API server for discovery in
          # modern kubectl versions even with --validate=false.
          curl -sSL -o /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /usr/local/bin kubeconform
          kubeconform -summary -strict -kubernetes-version 1.30.0 /tmp/dcim-default.yaml
          kubeconform -summary -strict -kubernetes-version 1.30.0 /tmp/dcim-k3d.yaml
