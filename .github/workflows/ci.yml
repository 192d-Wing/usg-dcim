name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # container-build pushes to ghcr.io on main; requires packages:write.
  # On PRs the push step is skipped and the broader permission is unused.
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finch:
    name: finch (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/finch
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Active LTS. Must match the builder stage in
          # packages/finch/Containerfile.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/finch/package-lock.json

      # package-lock.json is committed, so the old "npm ci if lockfile,
      # else npm install" fallback could only ever take the npm ci branch.
      # The dead branch was an unlocked install (S8543) and both branches
      # ran dependency lifecycle scripts (S6505).
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        # Held to a "report only" status while the codebase finishes Phase-1
        # cleanup; tests + build are the real gate.
        continue-on-error: true
        # Not `npx`: on a miss npx silently fetches a package from the
        # registry and runs it. This binary comes from the locked install
        # above or the step fails.
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json

      - name: Tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

  go:
    name: Go ${{ matrix.pkg }} (build + vet + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [badger, heron, magpie, beagle, otter-go, loadgen]
    defaults:
      run:
        working-directory: packages/${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Matches the golang:1.26-alpine builder in every Containerfile —
          # test on what we ship on. go.work's go directive is the floor,
          # not this value; setup-go v6 defaults GOTOOLCHAIN=local, so this
          # only has to satisfy it, and 1.26.5 >= go.work's 1.25.7.
          go-version: '1.26.5'
          # Cache derived from the per-package go.sum so each matrix shard
          # gets its own warm cache without cross-contamination.
          cache-dependency-path: packages/${{ matrix.pkg }}/go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  # sqlc-drift was retired here. The job's gate was waiting on an
  # alembic schema dump (packages/otter-go/db/schema.sql) that never
  # landed; after the alembic→goose cutover (PR #277) the dump path
  # is gone entirely. The drop-in replacement is a Postgres service
  # container that runs `go run ./cmd/otter-go-migrate -cmd up`,
  # `pg_dump`s the schema, and runs `sqlc generate` against that —
  # but locking that down requires also regenerating every committed
  # db/generated/*.sql.go file with current sqlc, which produces a
  # very large diff that wants its own focused PR. Tracked as a
  # follow-up. Until that lands, sqlc validation lives in the dev
  # workflow only (run `task otter-go:sqlc` before committing query
  # changes); CI no longer pretends to catch drift.

  wolf-coredns-nsec3sign:
    name: wolf/coredns-nsec3sign (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/wolf/coredns-nsec3sign
        # wolf/coredns-nsec3sign isn't listed in the repo-root go.work
        # because its coredns transitive deps are large and slow the
        # other Go shards. Build it as a standalone module instead.
        shell: bash
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: packages/wolf/coredns-nsec3sign/go.sum

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

  container-build:
    name: Container images build (Podman/Buildah)
    runs-on: ubuntu-latest
    needs: [finch, go]
    env:
      # On main: tag the commit SHA and `latest` so deploys can pin.
      # On PRs: tag only `ci` for build-only validation. Job-level so
      # the per-platform build, manifest-assembly, and push steps all
      # share one definition.
      IMAGE_TAGS: >-
        ${{ github.ref == 'refs/heads/main'
            && format('latest {0}', github.sha)
            || 'ci' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Self-contained services (build context = the package dir).
          #
          # The dcim-* images publish amd64 + arm64 manifest lists (the
          # windep dev cluster runs arm64 nodes). Their Containerfiles
          # cross-compile on the native runner arch via $BUILDPLATFORM,
          # so qemu only executes the small final-stage RUNs
          # (groupadd/useradd), never the Go or npm builds.
          #
          # `platforms`, NOT `archs`: the action's archs input maps to
          # `buildah bud --arch`, which does NOT populate the automatic
          # TARGETOS/TARGETARCH build args — GOARCH stayed empty and the
          # "arm64" variants shipped amd64 binaries (exec format error
          # on the nodes). `--platform` is what populates them.
          - { image: dcim-finch,  context: packages/finch,  containerfile: packages/finch/Containerfile,  platforms: 'linux/amd64, linux/arm64' }
          - { image: dcim-badger, context: packages/badger, containerfile: packages/badger/Containerfile, platforms: 'linux/amd64, linux/arm64' }
          # Go services that import packages/shared-go via an in-tree
          # replace directive — build context must be repo root so the
          # COPY of packages/shared-go resolves. The dcim-otter-go image
          # is multi-binary (otter-go HTTP server + scheduler + worker
          # + migrate); helm chooses the entrypoint per pod, so a Helm
          # release pins a single image tag for every otter-go deployment.
          - { image: dcim-heron,  context: .,               containerfile: packages/heron/Containerfile,  platforms: 'linux/amd64, linux/arm64' }
          - { image: dcim-magpie, context: .,               containerfile: packages/magpie/Containerfile, platforms: 'linux/amd64, linux/arm64' }
          - { image: dcim-beagle, context: .,               containerfile: packages/beagle/Containerfile, platforms: 'linux/amd64, linux/arm64' }
          - { image: dcim-otter-go, context: .,             containerfile: packages/otter-go/Containerfile, platforms: 'linux/amd64, linux/arm64' }
          # wolf DNS images — BUILD ONLY, never pushed from here.
          #
          # These already ship on a different release track:
          # ghcr.io/192d-wing/coredns-nsec3sign:v1.14.2-1 and
          # hickory-prom:v0.26.0-2 — <upstream-version>-<build>, cut by
          # hand and pinned by deploy/k8s/site42, deploy/docker/site-dns
          # and the DNS guides. Publishing them on the dcim-* latest+SHA
          # scheme would fork that convention and start overwriting the
          # hickory-prom:latest that docker-compose.hickory.yml falls
          # back to. So `publish: no` — we only want the compile checked.
          #
          # Both clone and compile their upstream (CoreDNS, hickory-dns)
          # from a pinned ARG default, so they are by far the slowest
          # shards; hickory-prom builds Rust from source.
          - { image: coredns-nsec3sign, context: packages/wolf/coredns-nsec3sign, containerfile: packages/wolf/coredns-nsec3sign/Containerfile, publish: 'no' }
          - { image: hickory-prom,      context: packages/wolf/hickory-prom,      containerfile: packages/wolf/hickory-prom/Containerfile,      publish: 'no' }
    steps:
      - uses: actions/checkout@v7

      # Iron Bank requires auth even to PULL, and every runtime stage now
      # has a FROM against registry1. So unlike the ghcr.io login further
      # down — which only gates the push on main — this has to run before
      # the build and on pull_request too.
      #
      # Consequence worth knowing: Actions secrets are not exposed to
      # dependabot-triggered runs or to fork PRs. REPO1/REPO1_USER must
      # also exist under Settings > Secrets > Dependabot or every
      # dependabot PR fails here.
      - name: Log in to registry1.dso.mil (Iron Bank)
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: registry1.dso.mil
          username: ${{ secrets.REPO1_USER }}
          password: ${{ secrets.REPO1 }}

      # arm64 shards need binfmt handlers for the final-stage RUNs.
      # qemu-user-static registers them kernel-wide with the F flag via
      # systemd-binfmt, which buildah picks up without further setup.
      - name: Enable qemu for arm64 stages
        if: contains(matrix.platforms || '', 'arm64')
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-user-static

      # Multi-arch shards build each platform in its own SEQUENTIAL
      # step and assemble the manifest list by hand. Passing both
      # platforms to one buildah-build call ran the two `buildah bud`
      # processes concurrently, and their racing pulls of the same
      # base-image name (nginx, ubi10) into shared containers-storage
      # let one platform's base leak into the other's image —
      # dcim-finch's "arm64" variant shipped the amd64 nginx and hit
      # `exec format error` on the arm64 nodes. The singular
      # `platform` input still drives `--platform`, which is what
      # populates the TARGETOS/TARGETARCH args the Containerfiles
      # cross-compile with (the `archs` input does not — see #367).
      #
      # squash: false everywhere — v3 flipped the default to true, and
      # squashing collapses the base image into the app layer, so our
      # images would stop sharing the alpine/nginx/UBI base layers.
      - name: Build ${{ matrix.image }} (native, build-only shards)
        if: ${{ !matrix.platforms }}
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          image: ${{ matrix.image }}
          tags: ${{ env.IMAGE_TAGS }}
          context: ./${{ matrix.context }}
          containerfiles: ./${{ matrix.containerfile }}
          squash: false

      # Multi-arch shards build with PODMAN, not the buildah action:
      # the runner's apt buildah silently ignores --platform when
      # resolving stages (its STEP log echoes `FROM nginx:1.31-alpine`
      # with the platform stripped, and even an explicit
      # `FROM --platform=$TARGETPLATFORM` came out amd64), so every
      # "arm64" image it produced carried an amd64 filesystem under
      # arm64 config metadata. The runner's podman (5.8+) resolves
      # per-stage platforms correctly — same engine that produces
      # verified-aarch64 images in local builds. --pull=always keeps
      # a base pulled by the amd64 pass from being reused by name in
      # the arm64 pass.
      - name: Build ${{ matrix.image }} (amd64 + arm64, podman)
        if: ${{ matrix.platforms }}
        run: |
          for arch in amd64 arm64; do
            podman build --platform "linux/$arch" --pull=always --format docker \
              -f "./${{ matrix.containerfile }}" \
              -t "localhost/${{ matrix.image }}-$arch:build" \
              "./${{ matrix.context }}"
          done

      # Config metadata can claim arm64 while the layers carry amd64
      # content (that is exactly what the --pull bug produced), so the
      # guard executes a binary FROM THE IMAGE under qemu: uname must
      # report aarch64 or the payload is not really arm64. Runs before
      # manifest assembly so a bad variant fails the shard.
      - name: Verify ${{ matrix.image }} arm64 payload
        if: ${{ matrix.platforms }}
        run: |
          got=$(podman run --rm --platform linux/arm64 --entrypoint uname "localhost/${{ matrix.image }}-arm64:build" -m)
          echo "arm64 variant reports: $got"
          test "$got" = "aarch64"

      - name: Assemble ${{ matrix.image }} manifest list
        if: ${{ matrix.platforms }}
        run: |
          for t in $IMAGE_TAGS; do
            podman manifest create "localhost/${{ matrix.image }}:$t"
            podman manifest add "localhost/${{ matrix.image }}:$t" "containers-storage:localhost/${{ matrix.image }}-amd64:build"
            podman manifest add "localhost/${{ matrix.image }}:$t" "containers-storage:localhost/${{ matrix.image }}-arm64:build"
            podman manifest inspect "localhost/${{ matrix.image }}:$t"
          done

      # Push happens only on pushes to main. PRs from forks won't have
      # packages:write anyway, so the conditional double-protects.
      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.publish != 'no'
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.image }} to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.publish != 'no'
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          # The assembled manifest list (multi-arch shards are the only
          # publishable ones) under the same tags the assembly step
          # created — push-to-registry pushes list + members.
          image: ${{ matrix.image }}
          tags: ${{ env.IMAGE_TAGS }}
          registry: ghcr.io/192d-wing

  helm:
    name: Helm chart lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.15.0

      - name: helm lint
        run: helm lint deploy/helm/dcim

      # Render both value sets and pipe through `kubectl apply --dry-run`
      # so we catch malformed YAML / invalid manifests before they hit
      # a real cluster. We don't have a persistent k3d in CI; the full
      # install drill is documented in docs/DEPLOYMENT.md.
      - name: helm template (default values)
        run: helm template dcim deploy/helm/dcim > /tmp/dcim-default.yaml

      - name: helm template (k3d values)
        run: |
          helm template dcim deploy/helm/dcim \
            -f deploy/helm/dcim/values-k3d.yaml > /tmp/dcim-k3d.yaml

      - name: Validate rendered manifests with kubeconform
        run: |
          # kubeconform is offline: it ships its own copy of the
          # upstream OpenAPI schemas, so it works without an apiserver.
          # Replaces the old `kubectl apply --dry-run=client` step,
          # which still tries to hit the API server for discovery in
          # modern kubectl versions even with --validate=false.
          # --proto '=https' keeps -L from being talked down to plain HTTP
          # by a redirect; the checksum then pins what we actually got.
          curl -sSL --proto '=https' --tlsv1.2 -o /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          # From the release's own CHECKSUMS file. Bump both together.
          echo '95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kc.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/kc.tar.gz -C /usr/local/bin kubeconform
          kubeconform -summary -strict -kubernetes-version 1.30.0 /tmp/dcim-default.yaml
          kubeconform -summary -strict -kubernetes-version 1.30.0 /tmp/dcim-k3d.yaml
