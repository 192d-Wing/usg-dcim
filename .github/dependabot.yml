version: 2
updates:
  # ----- Frontend (npm) -----
  # finch: React + Vite dashboard (was /frontend).
  - package-ecosystem: "npm"
    directory: "/packages/finch"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      refine:
        patterns: ["@refinedev/*"]
      radix:
        patterns: ["@radix-ui/*"]
      tooling:
        dependency-type: "development"

  # ----- Go modules -----
  # Each animal package is its own module. Grouping pgx/redis/prom bumps
  # keeps churn down; shared-go gets its own slot since other modules
  # depend on it via in-tree `replace` and we want bumps to ripple
  # deliberately.
  - package-ecosystem: "gomod"
    directory: "/packages/badger"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3
    groups:
      pg: { patterns: ["github.com/jackc/*"] }
      modernc: { patterns: ["modernc.org/*"] }

  - package-ecosystem: "gomod"
    directory: "/packages/heron"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3
    groups:
      pg: { patterns: ["github.com/jackc/*"] }
      prom: { patterns: ["github.com/prometheus/*"] }

  - package-ecosystem: "gomod"
    directory: "/packages/magpie"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3
    groups:
      pg: { patterns: ["github.com/jackc/*"] }
      redis: { patterns: ["github.com/redis/*"] }
      prom: { patterns: ["github.com/prometheus/*"] }

  - package-ecosystem: "gomod"
    directory: "/packages/beagle"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3
    groups:
      pg: { patterns: ["github.com/jackc/*"] }
      prom: { patterns: ["github.com/prometheus/*"] }

  - package-ecosystem: "gomod"
    directory: "/packages/otter-go"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3
    groups:
      pg: { patterns: ["github.com/jackc/*"] }
      chi: { patterns: ["github.com/go-chi/*"] }

  - package-ecosystem: "gomod"
    directory: "/packages/shared-go"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3
    groups:
      prom: { patterns: ["github.com/prometheus/*"] }

  # wolf coredns plugin — group CoreDNS bumps; miekg/dns surfaces
  # separately because it often needs a coordinated CoreDNS update.
  - package-ecosystem: "gomod"
    directory: "/packages/wolf/coredns-nsec3sign"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 5
    groups:
      coredns:
        patterns: ["github.com/coredns/*"]
      dns:
        patterns: ["github.com/miekg/dns"]

  # ----- Workflow + container bases -----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }

  - package-ecosystem: "docker"
    directory: "/packages/finch"
    schedule: { interval: "monthly" }
  - package-ecosystem: "docker"
    directory: "/packages/badger"
    schedule: { interval: "monthly" }
  - package-ecosystem: "docker"
    directory: "/packages/heron"
    schedule: { interval: "monthly" }
  - package-ecosystem: "docker"
    directory: "/packages/magpie"
    schedule: { interval: "monthly" }
  - package-ecosystem: "docker"
    directory: "/packages/beagle"
    schedule: { interval: "monthly" }
  - package-ecosystem: "docker"
    directory: "/packages/otter-go"
    schedule: { interval: "monthly" }
