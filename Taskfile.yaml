version: '3'

# Root Taskfile. Per-animal tasks live in packages/<animal>/Taskfile.yaml
# and are invoked as `task <animal>:<task>` (e.g. `task otter:dev`).

env:
  COMPOSE_FILE: deploy/docker/docker-compose.yml

includes:
  otter:     { taskfile: packages/otter/Taskfile.yaml,     dir: packages/otter }
  finch:     { taskfile: packages/finch/Taskfile.yaml,     dir: packages/finch }
  mole:      { taskfile: packages/mole/Taskfile.yaml,      dir: packages/mole }
  badger:    { taskfile: packages/badger/Taskfile.yaml,    dir: packages/badger }
  heron:     { taskfile: packages/heron/Taskfile.yaml,     dir: packages/heron }
  magpie:    { taskfile: packages/magpie/Taskfile.yaml,    dir: packages/magpie }
  beagle:    { taskfile: packages/beagle/Taskfile.yaml,    dir: packages/beagle }
  shared-go: { taskfile: packages/shared-go/Taskfile.yaml, dir: packages/shared-go }
  otter-go:  { taskfile: packages/otter-go/Taskfile.yaml,  dir: packages/otter-go }

tasks:
  help:
    desc: Display available tasks
    cmds:
      - |
        echo "USG DCIM dev tasks"
        echo ""
        echo "Cross-cutting:"
        echo "  task sync         install Python deps into .venv"
        echo "  task up / down    start / stop full stack via podman compose"
        echo "  task logs         tail all service logs"
        echo "  task build        build container images via compose"
        echo "  task test         run all package test suites"
        echo "  task lint         run all package linters"
        echo "  task fmt          run all package formatters"
        echo "  task migrate      apply Alembic migrations against running stack"
        echo "  task seed         load demo dataset against running stack"
        echo "  task clean        purge caches + node_modules + .venv"
        echo ""
        echo "Per-animal (task <animal>:<task>; run 'task --list' for the full set):"
        echo "  otter:    dev, worker, test, lint, fmt, migrate, seed"
        echo "  finch:    dev, build, test, lint, fmt, typecheck"
        echo "  mole:     run, lint                               (deprecated)"
        echo "  badger:   build, vet, test"
        echo "  heron:    build, vet, test"
        echo "  magpie:   build, vet, test"
        echo "  beagle:   build, vet, test"
        echo "  shared-go: vet, test"
        echo ""
        echo "Aliases for muscle memory:"
        echo "  task backend  -> task otter:dev"
        echo "  task frontend -> task finch:dev"
        echo "  task worker   -> task otter:worker"
        echo "  task collector-> task mole:run"
    silent: true

  # ---- Aliases for the most common single-package commands ----
  backend:    { desc: "Alias for `task otter:dev`",    deps: [otter:dev] }
  frontend:   { desc: "Alias for `task finch:dev`",    deps: [finch:dev] }
  worker:     { desc: "Alias for `task otter:worker`", deps: [otter:worker] }
  collector:  { desc: "Alias for `task mole:run`",     deps: [mole:run] }

  # ---- Dependency management ----
  sync:
    desc: Install Python deps into .venv (uv workspace)
    cmds:
      - uv sync --all-packages --all-extras

  # ---- Compose orchestration ----
  up:
    desc: Start full stack via podman compose
    cmds:
      - podman compose -f {{.COMPOSE_FILE}} up -d --build

  down:
    desc: Stop stack
    cmds:
      - podman compose -f {{.COMPOSE_FILE}} down

  logs:
    desc: Tail all service logs
    cmds:
      - podman compose -f {{.COMPOSE_FILE}} logs -f

  build:
    desc: Build container images
    cmds:
      - podman compose -f {{.COMPOSE_FILE}} build

  # ---- Operations against the running stack ----
  migrate:
    desc: Apply Alembic migrations against the running stack
    cmds:
      - podman compose -f {{.COMPOSE_FILE}} exec otter alembic upgrade head

  seed:
    desc: Load the demo dataset against the running stack
    cmds:
      - podman compose -f {{.COMPOSE_FILE}} exec otter python -m dcim.scripts.seed_demo

  # ---- Fan-out across all packages ----
  test:
    desc: Run every package's test suite
    deps:
      - otter:test
      - finch:test
      - badger:test
      - heron:test
      - magpie:test
      - beagle:test
      - shared-go:test
      - otter-go:test

  lint:
    desc: Run every package's linter
    deps:
      - otter:lint
      - finch:lint
      - mole:lint
      - badger:vet
      - heron:vet
      - magpie:vet
      - beagle:vet
      - shared-go:vet
      - otter-go:vet

  fmt:
    desc: Run every package's formatter (Python + JS only)
    deps:
      - otter:fmt
      - finch:fmt

  # ---- Cleanup ----
  clean:
    desc: Clean up generated files and caches
    cmds:
      - rm -rf .venv packages/otter/.pytest_cache packages/otter/.ruff_cache packages/otter/.mypy_cache
      - rm -rf packages/finch/node_modules packages/finch/dist
