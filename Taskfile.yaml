version: '3'

# Root Taskfile. Per-animal tasks live in packages/<animal>/Taskfile.yaml
# and are invoked as `task <animal>:<task>` (e.g. `task otter-go:dev`).

env:
  COMPOSE_FILE: deploy/docker/docker-compose.yml

includes:
  finch:     { taskfile: packages/finch/Taskfile.yaml,     dir: packages/finch }
  badger:    { taskfile: packages/badger/Taskfile.yaml,    dir: packages/badger }
  heron:     { taskfile: packages/heron/Taskfile.yaml,     dir: packages/heron }
  magpie:    { taskfile: packages/magpie/Taskfile.yaml,    dir: packages/magpie }
  beagle:    { taskfile: packages/beagle/Taskfile.yaml,    dir: packages/beagle }
  shared-go: { taskfile: packages/shared-go/Taskfile.yaml, dir: packages/shared-go }
  otter-go:  { taskfile: packages/otter-go/Taskfile.yaml,  dir: packages/otter-go }

tasks:
  help:
    desc: Display available tasks
    cmds:
      - |
        echo "USG DCIM dev tasks"
        echo ""
        echo "Cross-cutting:"
        echo "  task up / down    start / stop full stack via podman compose"
        echo "  task logs         tail all service logs"
        echo "  task build        build container images via compose"
        echo "  task test         run all package test suites"
        echo "  task lint         run all package linters"
        echo "  task fmt          run all package formatters"
        echo ""
        echo "Per-animal (task <animal>:<task>; run 'task --list' for the full set):"
        echo "  finch:    dev, build, test, lint, fmt, typecheck"
        echo "  badger:   build, vet, test"
        echo "  heron:    build, vet, test"
        echo "  magpie:   build, vet, test"
        echo "  beagle:   build, vet, test"
        echo "  shared-go: vet, test"
        echo "  otter-go:  build, vet, test, sqlc"
        echo ""
        echo "Aliases for muscle memory:"
        echo "  task frontend -> task finch:dev"
    silent: true

  # ---- Aliases for the most common single-package commands ----
  frontend:   { desc: "Alias for `task finch:dev`",    deps: [finch:dev] }

  # ---- Compose orchestration ----
  up:
    desc: Start full stack via podman compose
    cmds:
      - podman compose -f {{.COMPOSE_FILE}} up -d --build

  down:
    desc: Stop stack
    cmds:
      - podman compose -f {{.COMPOSE_FILE}} down

  logs:
    desc: Tail all service logs
    cmds:
      - podman compose -f {{.COMPOSE_FILE}} logs -f

  build:
    desc: Build container images
    cmds:
      - podman compose -f {{.COMPOSE_FILE}} build

  # ---- Fan-out across all packages ----
  test:
    desc: Run every package's test suite
    deps:
      - finch:test
      - badger:test
      - heron:test
      - magpie:test
      - beagle:test
      - shared-go:test
      - otter-go:test

  lint:
    desc: Run every package's linter
    deps:
      - finch:lint
      - badger:vet
      - heron:vet
      - magpie:vet
      - beagle:vet
      - shared-go:vet
      - otter-go:vet

  fmt:
    desc: Run every package's formatter (JS only)
    deps:
      - finch:fmt
