version: '3'

env:
  COMPOSE_FILE: deploy/docker/docker-compose.yml

tasks:
  help:
    desc: Display available tasks
    cmds:
      - |
        echo "USG DCIM dev tasks (Python via uv)"
        echo "  task sync         install backend + collector deps into .venv"
        echo "  task up           start full stack via podman compose"
        echo "  task down         stop stack"
        echo "  task logs         tail all service logs"
        echo "  task migrate      apply Alembic migrations against running stack"
        echo "  task seed         load demo enterprise dataset"
        echo "  task test         backend pytest + frontend vitest"
        echo "  task lint         ruff + eslint"
        echo "  task fmt          ruff format + prettier"
        echo "  task otter        run API (otter) locally on :8000  [alias: backend]"
        echo "  task worker       run arq worker locally"
        echo "  task collector    run sample collector (mole, deprecated) locally"
        echo "  task finch        vite dev server (finch) on :5173   [alias: frontend]"
    silent: true

  # Dependency Management
  sync:
    desc: Install backend + collector deps into .venv
    cmds:
      - uv sync --all-packages --all-extras

  # Podman Compose Tasks
  up:
    desc: Start full stack via docker-compose
    cmds:
      - podman compose -f {{.COMPOSE_FILE}} up -d --build

  down:
    desc: Stop stack
    cmds:
      - podman compose -f {{.COMPOSE_FILE}} down

  logs:
    desc: Tail all service logs
    cmds:
      - podman compose -f {{.COMPOSE_FILE}} logs -f

  build:
    desc: Build container images
    cmds:
      - podman compose -f {{.COMPOSE_FILE}} build

  # Database Migrations
  migrate:
    desc: Apply Alembic migrations against running stack
    cmds:
      - podman compose -f {{.COMPOSE_FILE}} exec api alembic upgrade head

  migrate-local:
    desc: Apply Alembic migrations locally
    cmds:
      - uv run --project packages/otter alembic -c packages/otter/alembic.ini upgrade head

  # Seeding
  seed:
    desc: Load demo enterprise dataset
    cmds:
      - podman compose -f {{.COMPOSE_FILE}} exec api python -m dcim.scripts.seed_demo

  seed-local:
    desc: Load demo enterprise dataset locally
    cmds:
      - uv run --project packages/otter python -m dcim.scripts.seed_demo

  # Testing & Code Quality
  test:
    desc: Run backend pytest + frontend vitest
    cmds:
      - uv run --project packages/otter pytest packages/otter/tests -q
      - cd packages/finch && npm test --silent

  lint:
    desc: Run ruff + eslint
    cmds:
      - uv run --project packages/otter ruff check packages/otter
      - cd packages/finch && npm run lint

  fmt:
    desc: Run ruff format + prettier
    cmds:
      - uv run --project packages/otter ruff format packages/otter
      - cd packages/finch && npm run fmt

  # Local Development (animal-named per WORKSPACE.md)
  otter:
    desc: Run API (otter) locally on :8000
    cmds:
      - uv run --project packages/otter uvicorn dcim.main:app --reload --port 8000 --host 0.0.0.0
  backend:
    desc: Alias for `task otter`
    deps: [otter]

  worker:
    desc: Run arq worker locally
    cmds:
      - uv run --project packages/otter arq dcim.worker.WorkerSettings

  collector:
    desc: Run sample collector (mole, deprecated) locally
    cmds:
      - uv run --project packages/mole dcim-collector --config packages/mole/sample-config.yaml

  finch:
    desc: Start finch (frontend) vite dev server on :5173
    cmds:
      - cd packages/finch && npm install && npm run dev
  frontend:
    desc: Alias for `task finch`
    deps: [finch]

  # Cleanup
  clean:
    desc: Clean up generated files and caches
    cmds:
      - rm -rf .venv packages/otter/.pytest_cache packages/otter/.ruff_cache packages/otter/.mypy_cache
      - rm -rf packages/finch/node_modules packages/finch/dist
