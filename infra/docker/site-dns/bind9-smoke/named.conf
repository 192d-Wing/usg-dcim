// BIND 9.20 smoke test — RFC 9432 catalog zone consumer.
//
// Verified end-to-end with BIND 9.20.22:
//
//   ✓ Catalog zone AXFR from CoreDNS succeeds (13 records)
//   ✓ Member zones auto-provisioned:
//       site42.prod.dcim.local, 5.0.10.in-addr.arpa, prod.dcim.local
//   ! epoch.*.zones / group.*.zones TXT records trigger "invalid record"
//     warnings — BIND 9.20 was released before RFC 9432 finalized
//     these v2 extension properties. Zones are still provisioned.
//   ! Member zones show "no primaries" — RFC 9432 section 4.2.3 allows
//     per-member primaries via `primaries.<member_id>.zones TXT` records
//     in the catalog zone. DCIM does not yet emit these; operators can
//     add static primaries here via `zone <name> { primaries { ip; }; }`.
//
// BIND 9.20 catalog-zones syntax notes:
//   - `catalog-zones { zone "name" { ... }; }` inner block was removed.
//     Use the bare `zone "name";` form inside the stanza.
//   - Member zones inherit no default primaries from the catalog zone
//     declaration in BIND 9.20 — explicit primaries must be configured
//     per member zone, or the catalog zone must carry `primaries.*`
//     property TXT records (tracked as a future DCIM renderer enhancement).
//
// CATALOG_ZONE_PLACEHOLDER is substituted with $CATALOG_ZONE at start.

options {
    directory "/var/cache/bind";
    listen-on     { any; };
    listen-on-v6  { none; };
    recursion     no;
    allow-query   { any; };
    allow-transfer { none; };

    // RFC 9432 consumer declaration. BIND reads the PTR member records
    // in this catalog zone and auto-provisions secondary zone stubs.
    catalog-zones { zone "CATALOG_ZONE_PLACEHOLDER"; };
};

// The catalog zone must be a secondary for BIND to AXFR it.
zone "CATALOG_ZONE_PLACEHOLDER" {
    type secondary;
    primaries { 172.30.42.10; };
    allow-transfer { none; };
    file "/var/cache/bind/catalog.CATALOG_ZONE_PLACEHOLDER.db";
};

// Uncomment + repeat for each member zone to enable full zone transfer.
// Once DCIM emits primaries.*.zones TXT property records in the catalog
// zone, this block will no longer be needed.
//
// zone "site42.prod.dcim.local" {
//     type secondary;
//     primaries { 172.30.42.10; };
//     file "/var/cache/bind/site42.prod.dcim.local.db";
// };
