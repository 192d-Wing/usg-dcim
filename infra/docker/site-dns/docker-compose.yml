# Site DNS bundle: collector + two CoreDNS pods (auth + recursive) + GoBGP sidecar.
#
# Operators bring this up at each site with:
#   docker compose -p site42 -f infra/docker/site-dns/docker-compose.yml up -d
#
# `-p site42` keeps the volume + container names from clashing with the
# central stack so you can run both compose projects side-by-side on
# the same Docker engine for end-to-end testing.
#
# The collector polls the central DCIM for the current bundle and writes
# Corefiles + zone files into the shared `dns-state` volume. CoreDNS pods
# read from that volume and reload on SIGUSR1; GoBGP reads gobgp.yaml and
# reloads on SIGHUP. All four containers share the host PID namespace so
# the collector can signal sibling processes by PID.

services:
  collector:
    # Native Go collector. The Python implementation under
    # ../../../collector is deprecated as of commit 59a2496; flip the
    # build.context back to it for emergency rollback (see
    # packages/mole/DEPRECATED.md for the procedure).
    build:
      context: ../../../packages/badger
      dockerfile: Containerfile
    # image: ghcr.io/192d-wing/usg-dcim-go-collector:latest
    command: ["-config", "/etc/dcim/collector.yaml"]
    # Run as root so the agent can write the DNS bundle into the
    # shared dns-state volume (CoreDNS containers run as root and
    # currently own everything under there) and reuse the buffer
    # volume that was populated by the previous Python image. The
    # central compose collector runs as the nonroot UID baked into
    # the Dockerfile; site collectors need root because they own the
    # resolver state on disk.
    user: "0:0"
    pid: "host"
    # Sit on dns-net so the metrics-scrape loop can reach both CoreDNS
    # pods by their service names (`http://coredns-auth:9153/metrics`
    # etc.). The default-bridge connection to central api still works
    # via the host-gateway shortcut below.
    networks:
      dns-net: {}
      default: {}
    # Talk back to the central API. When the central stack runs on the
    # same Docker engine, `host.docker.internal` resolves to the host's
    # IP and the central api is published on :8000.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${COLLECTOR_CONFIG:-./collector.yaml}:/etc/dcim/collector.yaml:ro
      # Bearer token central issued for this collector. The path inside
      # the container matches `api_token_file:` in collector.yaml.
      - ${COLLECTOR_TOKEN:-./token}:/etc/dcim/token:ro
      - collector-buffer:/var/lib/dcim-collector
      - dns-state:/var/lib/dcim-dns
    restart: unless-stopped

  coredns-auth:
    # Custom build of CoreDNS 1.14.2 with the `nsec3sign` plugin
    # compiled in (infra/coredns-nsec3sign). Drop-in for
    # `coredns/coredns:1.14.2` — same entrypoint, same `-conf` flag,
    # same ports. The plugin only kicks in for zones with NSEC3
    # params set in the rendered Corefile; pre-NSEC3 zones stay on
    # the upstream `dnssec` plugin path, so this image works for both
    # legacy and migrated operators.
    image: ghcr.io/192d-wing/coredns-nsec3sign:v1.14.2-1
    pid: "host"
    # CoreDNS image runs as a non-root user by default; the shared
    # dns-state volume is owned by root (the collector writes as root),
    # so coredns can't write its pidfile without running as root.
    user: "0:0"
    # Static bridge IP so the recursive pod's stub-zone forward to the
    # auth's unicast_ip remains stable across restarts. Update the
    # central DnsServer.unicast_ip to match (172.30.42.10).
    networks:
      dns-net:
        ipv4_address: 172.30.42.10
    # Publish to loopback on the host for ad-hoc dig/nslookup from the
    # operator's workstation during local testing. Real deployments
    # reach the auth pod via its management IP on the site network and
    # don't need this mapping.
    ports:
      - "127.0.0.1:15353:53/udp"
      - "127.0.0.1:15353:53/tcp"
    # The collector writes the Corefile + zones into the role
    # subdirectory of /var/lib/dcim-dns (per dns_agent's output_dir).
    # CoreDNS reads it from there directly — no separate /etc/coredns.
    command:
      - "-conf"
      - "/var/lib/dcim-dns/auth/Corefile"
      - "-pidfile"
      - "/var/lib/dcim-dns/auth/coredns.pid"
    volumes:
      - dns-state:/var/lib/dcim-dns
    restart: unless-stopped
    depends_on: [collector]

  coredns-recursive:
    # The recursive pod only forwards (no online signing), so the
    # stock CoreDNS image is fine here — we don't need the custom
    # nsec3sign plugin. Keep this in lockstep with the auth pod's
    # CoreDNS version so a single CoreDNS release covers both pods.
    image: coredns/coredns:1.14.2
    pid: "host"
    user: "0:0"
    # Share the dns-net bridge with the auth pod so the stub-zone
    # forward (rendered with auth's unicast_ip) routes container→
    # container without leaving the Docker network.
    networks:
      dns-net:
        ipv4_address: 172.30.42.20
    # In production the recursive pod runs on host networking so it can
    # bind the anycast IP brought up by the GoBGP sidecar. For local
    # testing we publish 53/udp+tcp to a specific workstation IP so
    # clients on the same LAN can resolve through it directly.
    ports:
      - "10.0.100.5:53:53/udp"
      - "10.0.100.5:53:53/tcp"
    command:
      - "-conf"
      - "/var/lib/dcim-dns/recursive/Corefile"
      - "-pidfile"
      - "/var/lib/dcim-dns/recursive/coredns.pid"
    volumes:
      - dns-state:/var/lib/dcim-dns
    restart: unless-stopped
    depends_on: [collector]

  gobgp:
    image: jauderho/gobgp:latest
    pid: "host"
    network_mode: "host"
    # jauderho/gobgp runs as a non-root user by default. Port 179 is
    # privileged, and on Docker Desktop cap_add: NET_BIND_SERVICE alone
    # doesn't translate to the host namespace, so run as root for the
    # bind to succeed.
    user: "0:0"
    # jauderho/gobgp is distroless (no shell) and gobgpd doesn't expose
    # a --pid-file flag, so we just run gobgpd directly. Config changes
    # are picked up by restart-loop — the collector's dns_agent leaves
    # gobgp_pidfile unset in collector.yaml so it doesn't try to
    # SIGHUP a process it can't find. `restart: unless-stopped` cycles
    # gobgpd quickly until the collector renders the initial yaml.
    # `--api-hosts :50051` matches gobgpd's documented default (bind
    # on all interfaces) — needed so the collector (running on the
    # dns-net bridge) can advertise anycast prefixes against the gRPC
    # API. Explicit because some packagings of gobgpd disable the
    # listener by default; passing the flag ensures it's always on.
    command:
      - "gobgpd"
      - "-f"
      - "/var/lib/dcim-dns/recursive/gobgp.yaml"
      - "--api-hosts"
      - ":50051"
    volumes:
      - dns-state:/var/lib/dcim-dns
    cap_add:
      # NET_BIND_SERVICE: gobgpd listens on TCP/179 (privileged port) and
      # the jauderho image runs as non-root.
      # NET_ADMIN: anycast advertisement brings up loopback routes for
      # the announced /32 and /128.
      - NET_BIND_SERVICE
      - NET_ADMIN
    restart: unless-stopped
    depends_on: [collector]

networks:
  dns-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.42.0/24

volumes:
  collector-buffer:
  dns-state:
