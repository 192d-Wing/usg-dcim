# Local-dev stack for USG DCIM. Production runs on Kubernetes via the Helm chart in infra/helm.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dcim
      POSTGRES_PASSWORD: dcim
      POSTGRES_DB: dcim
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dcim"]
      interval: 5s
      retries: 10

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Keycloak — local OIDC issuer for end-to-end SSO testing.
  # Preseeded realm `dcim` with client `dcim-spa` is imported on first start.
  # Login at http://localhost:8080 (admin / admin) to manage users.
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    profiles: ["sso"]   # opt-in: `docker compose --profile sso up`
    command:
      - "start-dev"
      - "--import-realm"
      - "--http-port=8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/dcim-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/realms/master || exit 1"]
      interval: 10s
      retries: 12

  # snmpsim — synthetic SNMP agent so the collector loop has something
  # real to poll without needing actual rack hardware.
  snmpsim:
    image: tandrup/snmpsim:latest
    profiles: ["collector"]
    ports: ["1161:1161/udp"]
    command:
      - "--agent-udpv4-endpoint=0.0.0.0:1161"
      - "--data-dir=/usr/local/snmpsim/data"
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep snmpsim"]
      interval: 10s
      retries: 6

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      DCIM_ENV: dev
      DCIM_LOG_JSON: "false"
      DCIM_POSTGRES_DSN: postgresql+asyncpg://dcim:dcim@postgres:5432/dcim
      DCIM_REDIS_DSN: redis://redis:6379/0
      DCIM_ELASTIC_URL: http://elastic:9200
      DCIM_CORS_ORIGINS: '["http://localhost:5173"]'
      DCIM_COLLECTOR_MTLS_REQUIRED: "false"
      # Pre-pointed at the keycloak service. Inactive unless the `sso`
      # profile is up — without keycloak the API just doesn't reach the
      # discovery doc and /auth/oidc/login returns 400, which is fine.
      DCIM_OIDC_ISSUER: http://keycloak:8080/realms/dcim
      DCIM_OIDC_CLIENT_ID: dcim-spa
      DCIM_OIDC_CLIENT_SECRET: dev-secret-change-me
      DCIM_OIDC_REDIRECT_URI: http://localhost:5173/login/callback
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      elastic:  { condition: service_healthy }
      redis:    { condition: service_healthy }

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["arq", "dcim.worker.WorkerSettings"]
    environment:
      DCIM_ENV: dev
      DCIM_LOG_JSON: "false"
      DCIM_POSTGRES_DSN: postgresql+asyncpg://dcim:dcim@postgres:5432/dcim
      DCIM_REDIS_DSN: redis://redis:6379/0
      DCIM_ELASTIC_URL: http://elastic:9200
    depends_on:
      api: { condition: service_started }

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports: ["5173:80"]
    depends_on: [api]

  collector:
    build:
      context: ../../collector
      dockerfile: Dockerfile
    profiles: ["collector"]   # opt-in: `docker compose --profile collector up`
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./collector-config.yaml:/etc/dcim/collector.yaml:ro
      - collector-buffer:/var/lib/dcim-collector
    depends_on:
      api: { condition: service_started }
      snmpsim: { condition: service_started }

volumes:
  pgdata:
  esdata:
  collector-buffer:
