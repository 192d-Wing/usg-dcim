# Local k3d overrides — strips production assumptions (HA datastores,
# Prometheus operator, mTLS) so `helm install` succeeds on a laptop
# cluster started with:
#
#   k3d cluster create dcim --port "8080:80@loadbalancer"
#
# Pair with the public ghcr.io image tags built by CI.

image:
  registry: ghcr.io/192d-wing/usg-dcim
  pullPolicy: IfNotPresent

api:
  replicaCount: 1
  autoscaling: { enabled: false }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }

worker:
  replicaCount: 1
  autoscaling: { enabled: false }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }

ingest:
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  mtls:
    enabled: false

frontend:
  replicaCount: 1

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: dcim.local
      paths:
        - { path: /,    pathType: Prefix, backend: frontend }
        - { path: /api, pathType: Prefix, backend: api }
  tls: []

# Single-node datastores — the chart's external=true paths assume an
# operator manages real HA clusters. For k3d we let the chart deploy
# Bitnami-style sub-deployments inline.
postgresql:
  external: false
  dsn: "postgresql+asyncpg://dcim:dcim@postgres:5432/dcim"

elasticsearch:
  external: false
  url: "http://elastic:9200"
  esJavaOpts: "-Xms512m -Xmx512m"

redis:
  external: false
  dsn: "redis://redis:6379/0"

config:
  jwtSecret: "k3d-dev-only-not-for-prod"
  collectorTokenSecret: "k3d-dev-only-not-for-prod"

# Skip the ServiceMonitor — k3d doesn't ship the Prometheus operator
# CRDs and the chart will refuse otherwise.
monitoring:
  serviceMonitor:
    enabled: false

networkPolicy:
  enabled: false
