[project]
name = "dcim"
version = "0.1.0"
description = "USG DCIM enterprise platform — central API, workers, ingest"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "opensearch-py[async]>=2.7",
    "redis>=5.0",
    "arq>=0.28.0",
    "httpx>=0.27",
    "authlib>=1.3",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.9",
    "structlog>=25.5.0",
    "orjson>=3.10",
    "prometheus-client>=0.25.0",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    "click>=8.1",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcim"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "SIM", "RUF"]
ignore = [
    "S101",
    "B008",
    # SQLAlchemy's canonical idiom is `from sqlalchemy.dialects.postgresql import UUID as PgUUID`.
    # Pep8-naming flags the upper-case alias; we accept it project-wide.
    "N811",
    # `class X(str, enum.Enum)` → suggest `StrEnum`. StrEnum's __str__ returns
    # the value not the name, which interacts subtly with SQLAlchemy enum
    # persistence. Migrating is a separate, audited refactor.
    "UP042",
    # `Generic[T]` → PEP 695 type-parameter syntax. The Page[T] container is
    # exported as a Pydantic v2 generic and Pydantic still expects the
    # classic Generic spelling for runtime construction.
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
# Alembic-generated revisions — leave wide column lists alone.
"src/dcim/migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
