{{- /*
  CoreDNS pod + bundle-puller sidecar, one Deployment per DnsServer
  release. Cilium BGP advertises the Service IP (see service.yaml);
  no GoBGP sidecar here — that's the whole point of PR 71.

  Shared emptyDir `dns-state` carries the bundle files. Layout matches
  the existing collector contract (/var/lib/dcim-dns/{auth,recursive}/)
  so the same code that runs in deploy/k8s/site42 reads the same paths.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dnsSite.fullname" . }}
  labels:
    {{- include "dnsSite.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dnsSite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dnsSite.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: coredns
          image: {{ include "dnsSite.corednsImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-conf"
            - "/var/lib/dcim-dns/{{ .Values.server.role }}/Corefile"
          ports:
            - { name: dns-udp, containerPort: 53, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, protocol: TCP }
            - { name: metrics, containerPort: 9153, protocol: TCP }
            - { name: health,  containerPort: 8080, protocol: TCP }
          readinessProbe:
            httpGet: { path: /health, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: health }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: dns-state, mountPath: /var/lib/dcim-dns }
            {{- if .Values.dnstap.enabled }}
            - { name: dnstap, mountPath: /var/lib/dcim-dns-dnstap }
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: bundle-puller
          image: {{ include "dnsSite.collectorImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DCIM_DNS_SERVER_ID
              value: {{ .Values.server.id | quote }}
            - name: DCIM_DNS_ROLE
              value: {{ .Values.server.role | quote }}
            - name: DCIM_BUNDLE_URL
              value: "{{ .Values.bundle.apiBaseUrl }}/api/v1/dns/servers/{{ .Values.server.id }}/bundle"
            - name: DCIM_BUNDLE_POLL_SECONDS
              value: {{ .Values.bundle.pollSeconds | quote }}
            - name: DCIM_BUNDLE_STATE_DIR
              value: "/var/lib/dcim-dns/{{ .Values.server.role }}"
            - name: DCIM_BUNDLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bundle.tokenSecretName }}
                  key: {{ .Values.bundle.tokenSecretKey }}
            {{- if .Values.bundle.caBundleSecretName }}
            - name: DCIM_BUNDLE_CA
              value: "/etc/dcim-ca/{{ .Values.bundle.caBundleSecretKey }}"
            {{- end }}
          volumeMounts:
            - { name: dns-state, mountPath: /var/lib/dcim-dns }
            {{- if .Values.bundle.caBundleSecretName }}
            - { name: dcim-ca, mountPath: /etc/dcim-ca, readOnly: true }
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
      volumes:
        - name: dns-state
          emptyDir: {}
        {{- if .Values.dnstap.enabled }}
        - name: dnstap
          emptyDir: {}
        {{- end }}
        {{- if .Values.bundle.caBundleSecretName }}
        - name: dcim-ca
          secret:
            secretName: {{ .Values.bundle.caBundleSecretName }}
        {{- end }}
      shareProcessNamespace: true
