# Default values for dcim Helm chart.
# Override with `helm install dcim deploy/helm/dcim -f my-values.yaml`.

image:
  registry: ghcr.io/usg-dcim
  pullPolicy: IfNotPresent
  tag: "0.1.0"

otter:
  replicaCount: 3
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 1,    memory: 2Gi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
  service:
    type: ClusterIP
    port: 8000

worker:
  replicaCount: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 1,    memory: 2Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    queueDepthTarget: 50
  # Grant CAP_NET_RAW so the worker can run ICMP health-check probes
  # (RFC 792 echo). On clusters where `net.ipv4.ping_group_range` is
  # set wide enough to cover the worker GID (10001 by default), the
  # probe falls back to unprivileged SOCK_DGRAM ICMP and this
  # capability is not strictly required — flip to false if your
  # cluster policy forbids NET_RAW. With both disabled, the probe
  # returns status=unknown with a "icmp socket requires CAP_NET_RAW
  # or net.ipv4.ping_group_range" error so the UI flags the gap.
  capNetRaw: true

heron:
  replicaCount: 3
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: 2,    memory: 4Gi }
  service:
    type: ClusterIP
    port: 8443
  mtls:
    enabled: true
    caBundleSecret: dcim-collector-ca

finch:
  replicaCount: 2
  resources:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 200m, memory: 256Mi }
  service:
    type: ClusterIP
    port: 80

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: dcim.example.mil
      paths:
        - path: /
          pathType: Prefix
          backend: finch
        - path: /api
          pathType: Prefix
          backend: otter
  tls:
    - secretName: dcim-tls
      hosts: [dcim.example.mil]

postgresql:
  external: true
  dsn: "postgresql+asyncpg://dcim:CHANGE_ME@postgres-ha:5432/dcim"

redis:
  external: true
  dsn: "redis://redis-ha:6379/0"

objectStorage:
  endpoint: "https://s3.example.mil"
  bucket: dcim-reports
  credentialsSecret: dcim-s3-creds

config:
  jwtSecret:                "PROVIDE_VIA_SECRET"
  collectorTokenSecret:     "PROVIDE_VIA_SECRET"
  collectorStaleSeconds:    600
  alertEvalIntervalSeconds: 30
  oidc:
    issuer: ""
    clientId: ""
    clientSecretRef: ""
  saml:
    metadataUrl: ""

# OpenTelemetry traces. Off by default; flip enabled=true and point
# exporterEndpoint at an existing OTLP/HTTP collector (Tempo, Jaeger,
# Honeycomb's OTLP endpoint, vendor-managed APM, ...). The chart does
# not deploy a collector — that's the operator's choice.
otel:
  enabled: false
  # Defaults to https; if your in-cluster collector terminates TLS at
  # the service-mesh sidecar or via a separate ingress, override to
  # http://... in your environment-specific values file.
  exporterEndpoint: https://otel-collector.observability.svc.cluster.local:4318
  environment: prod

migrations:
  runOnInstall: true
  runOnUpgrade: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }

networkPolicy:
  enabled: true

monitoring:
  serviceMonitor:
    enabled: true
    namespace: monitoring
