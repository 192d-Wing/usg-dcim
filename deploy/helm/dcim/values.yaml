# Default values for the dcim umbrella chart.
# Override with `helm install dcim deploy/helm/dcim -f my-values.yaml`.
#
# The umbrella owns cross-cutting concerns (ingress, networkpolicy, shared
# secrets, migrations Job) and bundles one subchart per animal under
# `charts/`. Per-animal blocks are passed through to the matching subchart
# (Helm merges `otter:` into the otter subchart's `.Values`, etc.).
#
# Shared values under `global:` are auto-propagated to every subchart.

global:
  image:
    registry: ghcr.io/usg-dcim
    pullPolicy: IfNotPresent
    tag: "0.1.0"

  postgresql:
    external: true
    dsn: "postgresql+asyncpg://dcim:CHANGE_ME@postgres-ha:5432/dcim"

  redis:
    external: true
    dsn: "redis://redis-ha:6379/0"

  config:
    jwtSecret:                "PROVIDE_VIA_SECRET"
    # CSV of base64-or-plain previous JWT secrets, ordered newest first.
    # On rotation: move the current jwtSecret here, set the new one
    # above. Both otter (Python) and otter-go validate against the
    # primary + every old secret until tokens carrying old kids
    # naturally expire (jwt_ttl_seconds, 15 min by default). Drop old
    # entries after the TTL has elapsed. Empty disables rotation
    # support — sessions minted under the previous key 401 immediately.
    jwtOldSecrets:            ""
    collectorTokenSecret:     "PROVIDE_VIA_SECRET"
    collectorStaleSeconds:    600
    alertEvalIntervalSeconds: 30
    oidc:
      issuer: ""
      clientId: ""
      # Client secret minted by the IdP. Stamped into dcim-secrets
      # (key `oidc_client_secret`) and surfaced to both otter + otter-go
      # via DCIM_OIDC_CLIENT_SECRET. Required for confidential clients
      # — leave "" only when using a public client (PKCE).
      clientSecret: ""
      # Browser-facing callback URL the SPA hands the IdP at /auth/oidc/login.
      # Must match a redirectUri registered on the IdP client (Keycloak
      # admin → clients → <id> → Valid Redirect URIs). The token-exchange
      # leg must send this byte-for-byte same value back to the IdP, so
      # scheme matters: https vs http mismatches with the SPA origin
      # show up as "Incorrect redirect_uri" at token exchange.
      redirectUri: ""
    saml:
      metadataUrl: ""
    # Region-deploy kubeconfig-callback wiring. `centralUrl` is the
    # public base URL the in-cluster kubeconfig-callback.service
    # unit POSTs to (scheme://host[:port], no trailing /api). The
    # secret is the HMAC key used to derive per-deployment bootstrap
    # tokens; when left as PROVIDE_VIA_SECRET the callback endpoint
    # fails closed with 503. Required for the region-deploy flow.
    regiondeploy:
      callbackSecret: "PROVIDE_VIA_SECRET"
      centralUrl:     ""
    # Fernet key used for at-rest encryption of two distinct columns,
    # all reached via DCIM_DNS_DNSSEC_SECRET:
    #   * DnsKey.private_pem            — Python otter services/dns.py
    #   * User.idp_refresh_token        — otter-go internal/auth + Python
    # Same key everywhere so any pod can decrypt rows any other pod
    # wrote; rotating it requires re-encrypting both columns. Empty ->
    # plaintext fallback with a loud structlog/slog warning; only
    # acceptable in sealed dev environments. Generate via
    # `python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`.
    dnssecSecret: ""

  otel:
    enabled: false
    exporterEndpoint: https://otel-collector.observability.svc.cluster.local:4318
    environment: prod

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile: { type: RuntimeDefault }

  # Prometheus ServiceMonitor scraping. Subcharts emit a ServiceMonitor
  # for their admin port when enabled is true. Requires the
  # prometheus-operator CRDs to be installed in the cluster.
  monitoring:
    serviceMonitor:
      enabled: false
      # Namespace where the Prometheus instance lives — set to the
      # operator's release namespace so it can discover the SMs.
      namespace: monitoring
      interval: 30s
      scrapeTimeout: 10s
      # Extra labels merged onto every ServiceMonitor; commonly used to
      # match a Prometheus instance's serviceMonitorSelector. Example:
      #   release: kube-prometheus-stack
      labels: {}

# Per-animal subchart values (passed through to charts/<animal>/).

# The Python `otter` API subchart was retired after the full Go cutover
# (every former route lives on otter-go now). The `otter-worker` block
# below stays because the arq orchestrator + cron worker still serves
# real traffic; it just ships the dcim-otter image with an arq CMD
# override.

otter-go:
  enabled: true
  # Endpoints currently owned by otter-go and routed via the
  # umbrella's ingress (`ingress.hosts[].paths`):
  #   /api/v1/lir/*    LIR pools/requests/allocations
  #   /api/v1/ipam/*   full IPAM surface (PR 18 cutover):
  #                    fabrics + vrfs + vrf-bgp-peers + supernets +
  #                    subnets + addresses + overlays + vnis + vteps +
  #                    vtep-memberships + free-space + utilization +
  #                    bulk endpoints + DHCP (push/diff/CRUD/reconcile/
  #                    lease-ingest from PR 17). The supernets/{id}/move
  #                    regex rule collapsed into this Prefix.
  # replicaCount + PDB + service.port live in the subchart's own
  # values.yaml; override here only when a deployment needs different.

otter-go-scheduler:
  # Disabled by default — Python's arq worker is still firing the
  # same crons today. Set to true once a deployment is ready to
  # validate the Go scheduler alongside arq (the dns_purge_metrics
  # job is idempotent so brief overlap is safe). Follow-up PRs
  # disable matching arq cron entries once the Go side is verified.
  enabled: false

otter-worker:
  enabled: true
  replicaCount: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 1,    memory: 2Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    queueDepthTarget: 50
  # Grant CAP_NET_RAW so the worker can run ICMP health-check probes
  # (RFC 792 echo). With CAP_NET_RAW disabled AND ping_group_range too
  # narrow, the probe returns status=unknown with a "icmp socket requires
  # CAP_NET_RAW or net.ipv4.ping_group_range" error and the UI flags it.
  capNetRaw: true

finch:
  enabled: true
  replicaCount: 2
  resources:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 200m, memory: 256Mi }
  service:
    type: ClusterIP
    port: 80
    labels: {}
    annotations: {}
    loadBalancerClass: ""

heron:
  enabled: true
  replicaCount: 3
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: 2,    memory: 4Gi }
  service:
    type: ClusterIP
    port: 8443
    labels: {}
    annotations: {}
    loadBalancerClass: ""
  mtls:
    enabled: true
    caBundleSecret: dcim-collector-ca

magpie:
  enabled: true
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

beagle:
  enabled: true
  replicaCount: 1
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 200m, memory: 256Mi }
  # NET_RAW for privileged ICMP. Without it the prober uses unprivileged
  # SOCK_DGRAM (works on Linux with net.ipv4.ping_group_range covering
  # the container GID) and falls back to TCP/HTTP probes otherwise.
  capNetRaw: true

# Site collector (badger) is opt-in: by default the central chart does
# not deploy a collector pod. Sites run their own collector outside the
# central namespace via deploy/k8s/site-base/ or compose.
badger:
  enabled: false
  replicaCount: 1

# ---- Umbrella-level resources (ingress, networkpolicy, secrets, migrations) ----

ingress:
  enabled: true
  className: nginx
  # nginx-ingress regex annotation is preserved for compatibility
  # with any controller-specific filters operators have layered on
  # top, but the IPAM cutover (PR 18) collapsed the
  # supernets/{id}/move ImplementationSpecific rule into the broader
  # /api/v1/ipam Prefix rule — every non-DHCP IPAM resource is now
  # on otter-go via PR 42's basic CRUD + PR 54/55's ABAC. The /dhcp
  # Prefix rule still sits below /api/v1/ipam but is now redundant
  # under the broader rule; kept as a marker since the DHCP backend
  # share between Go's dhcp endpoints and the rest of IPAM happens
  # to land in the same backend.
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: dcim.example.mil
      paths:
        # The Kubernetes Ingress spec mandates longest-prefix-match for
        # Prefix rules regardless of declaration order — both nginx-ingress
        # and the Gateway API HTTPRoute resource follow this. On other
        # controllers (Traefik IngressRoute, AWS ALB rule priorities)
        # ordering can matter; we keep specific-first as a defensive
        # convention. ImplementationSpecific paths take precedence over
        # Prefix when use-regex is on (nginx behavior), which is what makes
        # the supernets/.../move regex catch before the /api Prefix.
        # PR 18 cutover: all of /api/v1/ipam/* on otter-go. PR 42
        # ported the basic CRUD; PR 54 + 55 added the 1-hop and
        # 2+ hop ABAC; PR 17 brought DHCP under the umbrella. This
        # broad Prefix rule supersedes the supernets/.../move
        # ImplementationSpecific regex and the /api/v1/ipam/dhcp
        # Prefix that lived here before — both still route to
        # otter-go, just via the wider rule now.
        - path: /api/v1/ipam
          pathType: Prefix
          backend: otter-go
        - path: /api/v1/lir
          pathType: Prefix
          backend: otter-go
        # PR 179 cutover: /api/v1/auth/* moves to otter-go. Every
        # authenticated request hits /auth/me, so this is the highest-
        # blast-radius cutover. Parity verified: Go and Python share
        # the same jwt_secret + revoked_jtis table + oidc_client_secret
        # (see PR 176 secrets wiring) and otter-go's middleware was
        # cap-gate-retrofitted in PR 177 + 178. /auth/me wire shape
        # matches Python byte-for-byte (user.id, user.email,
        # via_token, sorted capabilities).
        - path: /api/v1/auth
          pathType: Prefix
          backend: otter-go
        # PR 180 cutover: /api/v1/audit/* moves to otter-go. PR 177
        # landed the RequireCapability("audit:events:read") wrap and
        # the scope_site_ids ABAC filter on ListAuditLog /
        # CountAuditLog / ListAuditActions, plus the audit_log
        # (site_id, action) index migration (0066). Refine pagination
        # (?page=N) handled by audit handler's parseOffset. Page-body
        # shape is the otter-go canonical {items, total, limit,
        # offset} rather than Python's {items, page, page_size, total,
        # has_more}; finch's data-provider reads only items+total so
        # the table renders correctly. Lower blast radius than auth
        # — finch hits /audit only when an operator opens the audit
        # page.
        - path: /api/v1/audit
          pathType: Prefix
          backend: otter-go
        # PR 178 cutover: telemetry read path moves to otter-go.
        # /api/v1/ingest/telemetry (POST) is intentionally NOT in this
        # set — it stays on Python otter until a Go port lands (heron
        # already serves mTLS ingest; the HTTP fallback is small but
        # high-throughput, and a parity port is its own PR). The
        # /api/v1/telemetry/series GET endpoint has full Go parity
        # since PR 177's cap-gate retrofit, so cutting it over now
        # frees Python otter from the read-side fan-out.
        - path: /api/v1/telemetry
          pathType: Prefix
          backend: otter-go
        # /api/v1/admin/* fully on otter-go since the capabilities +
        # system-dns port. The longer-prefix Python paths PR #182
        # introduced are gone — a single Prefix rule now suffices.
        - path: /api/v1/admin
          pathType: Prefix
          backend: otter-go
        # PR-search cutover: global search moved to otter-go. The
        # Python implementation hit four tables sequentially under a
        # single AsyncSession; the Go port keeps the same shape.
        - path: /api/v1/search
          pathType: Prefix
          backend: otter-go
        # Inventory module fully on otter-go after cables PATCH port.
        # Single Prefix rule supersedes the longer-prefix /cables split
        # that lived here while cables stayed on Python.
        - path: /api/v1/inventory
          pathType: Prefix
          backend: otter-go
        # /api/v1/dashboards/* fully on otter-go across Phases 1-3
        # (enterprise + free-space + sites/at-risk + assets/{id} +
        # sites/{id} + racks/{id} + 3 forecast endpoints). Single
        # Prefix rule supersedes the per-phase rules that lived here.
        - path: /api/v1/dashboards
          pathType: Prefix
          backend: otter-go
        # BGP module fully on otter-go (TCP-AO via PRs #203/#204; the
        # rest — asns/prefix-lists/community-lists/route-maps + their
        # entries — were already implemented on Go in PR 44 but stayed
        # dark until this PR cut the ingress over. Single Prefix rule
        # supersedes the per-resource TCP-AO splits that lived here.
        - path: /api/v1/bgp
          pathType: Prefix
          backend: otter-go
        # Alerts module fully on otter-go (this PR). All 12 routes
        # (alerts list/ack, rules CRUD, maintenance-windows CRUD)
        # were implemented on Go in PR 45 but stayed dark code until
        # this PR cut the ingress over. Python's arq-driven
        # evaluation loop in services/alerts.py is unchanged — the
        # HTTP routes move; the eval loop stays Python until the Go
        # scheduler is in place (followup).
        - path: /api/v1/alerts
          pathType: Prefix
          backend: otter-go
        # PR 33 cutover: full /api/v1/dns/* on otter-go. The
        # bundle-renderer port (PRs #247-#255) finally closed the
        # last gap. Auth-server bundle endpoint is feature-complete;
        # recursive servers return 501 until GoBGP YAML + RPZ zone
        # + recursive engine helpers port in a follow-up. The
        # broader prefix supersedes the /api/v1/dns/bgp-peers Prefix
        # from PR #214 (still routes to the same backend, just via
        # the broader rule).
        - path: /api/v1/dns
          pathType: Prefix
          backend: otter-go
        # Notifications module fully on otter-go after the test
        # endpoint port. The existing channels CRUD was already
        # implemented on Go (PR 45 + the RBAC fix in PR #207); the
        # new POST /channels/{id}/test endpoint mirrors Python's
        # services.notifications dispatch (webhook + slack + email
        # senders) so operators can verify wiring before relying on
        # it for real incidents. Same ABAC (notifications:channels:*),
        # 23505 → 409 mapping added to httpx.Mapped so duplicate
        # channel-name conflicts surface as 409 (Python's pre-check
        # returned the same status).
        - path: /api/v1/notifications
          pathType: Prefix
          backend: otter-go
        # PR 19 cutover: organization + stencils on otter-go. Both
        # had full Go parity already (organization CRUD in
        # internal/organization; stencils LIST in internal/stencils);
        # this PR routes the ingress + drops the Python routers.
        - path: /api/v1/organizations
          pathType: Prefix
          backend: otter-go
        - path: /api/v1/stencils
          pathType: Prefix
          backend: otter-go
        # PR 20 cutover: /api/v1/power on otter-go.
        - path: /api/v1/power
          pathType: Prefix
          backend: otter-go
        # PR 21 cutover: /api/v1/collectors on otter-go.
        - path: /api/v1/collectors
          pathType: Prefix
          backend: otter-go
        # PR 22 cutover: /api/v1/ingest/telemetry on otter-go.
        - path: /api/v1/ingest
          pathType: Prefix
          backend: otter-go
        # PR 33 cutover: /api/v1/dns/* fully on otter-go (the bundle
        # endpoint + the rest of the zones/records/keys/health-checks/
        # anycast-bindings/blocklists/views/forwarders/catalog-zones
        # surface). The longer-prefix /api/v1/dns/bgp-peers rule
        # collapses into this broader rule; auth servers are feature-
        # complete, recursive servers return 501 until the GoBGP + RPZ
        # + recursive engine helpers port in a follow-up.
        - path: /api/v1/dns
          pathType: Prefix
          backend: otter-go
        # Region-deploy fully on otter-go after the /start port. The
        # per-route ImplementationSpecific regex rules collapsed into
        # a single Prefix now that every subpath shares the same
        # backend.
        - path: /api/v1/region-deployments
          pathType: Prefix
          backend: otter-go
        # /api catch-all: otter-go now owns every /api/v1/* surface.
        # The chi router 404s unknown paths with a {"detail": "..."}
        # JSON body — a real API error shape, not finch's HTML 404 —
        # so any stray request to a deleted endpoint surfaces cleanly.
        - path: /api
          pathType: Prefix
          backend: otter-go
        - path: /
          pathType: Prefix
          backend: finch
  tls:
    - secretName: dcim-tls
      hosts: [dcim.example.mil]

objectStorage:
  endpoint: "https://s3.example.mil"
  bucket: dcim-reports
  credentialsSecret: dcim-s3-creds

migrations:
  runOnInstall: true
  runOnUpgrade: true

networkPolicy:
  enabled: true

# (Per-instance monitoring settings live under `global.monitoring` above
# so subcharts can read them via Helm's global-merge.)

# ---- Cilium BGP exposure (PR 70) ----
# Opt-in: when bgp.enabled=true, the umbrella emits the four Cilium CRDs
# (CiliumBGPPeerConfig / CiliumBGPClusterConfig / CiliumBGPAdvertisement /
# CiliumLoadBalancerIPPool) needed to advertise type=LoadBalancer Service
# IPs to upstream routers. The status quo (ClusterIP behind nginx-ingress)
# keeps working unchanged; flip a subchart's service.type to LoadBalancer
# AND attach the advertise selector label to publish that Service.
bgp:
  enabled: false
  # Local ASN of this cluster. Peers' ASNs go in `peers[].asn`.
  localASN: 65000
  # Upstream routers. Each peer joins the bgpInstances[0].peers list.
  peers: []
    # - { name: rtr-a, address: "2001:db8:1::1", asn: 65001 }
    # - { name: rtr-b, address: "2001:db8:1::2", asn: 65001 }
  timers:
    holdSeconds: 9
    keepAliveSeconds: 3
  gracefulRestartSeconds: 120
  # AFI/SAFI families enabled per peer. v6-unicast first matches the
  # regional-cluster default (regiondeploy/cilium.py); add v4-unicast
  # for dual-stack clusters.
  families:
    - { afi: ipv6, safi: unicast }
  # Which Services to advertise. Default selector keys on a single label
  # operators stamp onto the Services they want advertised. Subchart
  # service blocks carry a matching `service.labels` map.
  advertise:
    selectorLabels:
      dcim.io/bgp-advertise: "true"
  # IP pools Cilium hands out to type=LoadBalancer Services. Multiple
  # pools are supported (e.g. one v6 public, one v4 transition pool);
  # each can scope itself to a subset of Services via serviceSelector.
  ipPools: []
    # - name: public-v6
    #   blocks:
    #     - { cidr: "2001:db8:1:ffff::/120" }
    #   serviceSelector:
    #     dcim.io/bgp-advertise: "true"

# ---- Cilium L2 announcement fallback (PR 89) ----
# For sites whose upstream is L2-only (no BGP-capable router). Mutually
# exclusive with bgp.enabled — setting both fails Helm rendering so
# operators can't accidentally double-advertise. Both default false:
# the chart's status quo (ClusterIP behind nginx-ingress) is unchanged.
#
# Cilium gratuitous-ARP / NDP from a subset of nodes onto a chosen L2
# segment. Same selector label as BGP (`dcim.io/bgp-advertise: "true"`)
# so the dns-site / dhcp-site charts don't need a second label for L2
# mode — flipping bgp.enabled → l2.enabled at the umbrella swaps the
# advertise mechanism without touching the Service definitions.
l2:
  enabled: false
  # Which nodes speak L2. Empty = every node; for racks with a
  # dedicated upstream-facing node set, pin via labels.
  nodeSelector: {}
    # role.dcim.io/lb-speaker: "true"
  # Which interfaces emit gratuitous-ARP. Empty = Cilium picks
  # automatically based on routing.
  interfaces: []
    # - "^eth0$"
  # Announce externalIPs Services too? Default: only LB IPs.
  externalIPs: false
  loadBalancerIPs: true
  advertise:
    selectorLabels:
      dcim.io/bgp-advertise: "true"
  # IP pools Cilium hands out for L2-announced Services.
  ipPools: []
    # - name: lab-lan
    #   blocks:
    #     - { cidr: "192.168.10.240/29" }
