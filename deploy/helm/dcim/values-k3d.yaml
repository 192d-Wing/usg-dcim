# Local k3d overrides — strips production assumptions (HA datastores,
# Prometheus operator, mTLS) so `helm install` succeeds on a laptop
# cluster started with:
#
#   k3d cluster create dcim --port "8080:80@loadbalancer"
#
# Pair with the public ghcr.io image tags built by CI.

global:
  image:
    registry: ghcr.io/192d-wing/usg-dcim
    pullPolicy: IfNotPresent
  postgresql:
    external: false
    dsn: "postgresql+asyncpg://dcim:dcim@postgres:5432/dcim"
  redis:
    external: false
    dsn: "redis://redis:6379/0"
  config:
    jwtSecret: "k3d-dev-only-not-for-prod"
    collectorTokenSecret: "k3d-dev-only-not-for-prod"

otter:
  replicaCount: 1
  autoscaling: { enabled: false }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }

otter-worker:
  replicaCount: 1
  autoscaling: { enabled: false }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }

heron:
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  mtls:
    enabled: false

finch:
  replicaCount: 1

# Single replica on k3d so a single-node cluster doesn't fail
# scheduling the second pod for the default PDB. PDB explicitly
# disabled — k3d drains would deadlock.
otter-go:
  replicaCount: 1
  podDisruptionBudget:
    enabled: false

# Opt the lab cluster into the new Go scheduler so the harness gets
# real validation alongside Python's arq. Both fire dns_purge_metrics
# (Python at minute=23, Go default same) — DELETE is idempotent so
# the overlap is wasted-work, not corruption.
otter-go-scheduler:
  enabled: true

magpie:
  enabled: false

beagle:
  enabled: false

ingress:
  enabled: true
  className: traefik
  # Traefik handles regex paths via IngressRoute CRD rather than nginx's
  # use-regex annotation. On k3d we rely on Prefix-only routing and
  # accept that /api/v1/ipam/supernets/{id}/move won't hit otter-go —
  # the LIR Unassigned-Move modal isn't load-bearing for local dev.
  hosts:
    - host: dcim.local
      paths:
        - { path: /api/v1/lir,       pathType: Prefix, backend: otter-go }
        - { path: /api/v1/auth,      pathType: Prefix, backend: otter-go }
        - { path: /api/v1/audit,     pathType: Prefix, backend: otter-go }
        - { path: /api/v1/telemetry, pathType: Prefix, backend: otter-go }
        - { path: /api/v1/admin,     pathType: Prefix, backend: otter-go }
        - { path: /api/v1/search,    pathType: Prefix, backend: otter-go }
        # Inventory module fully on otter-go after cables PATCH port.
        - { path: /api/v1/inventory,        pathType: Prefix, backend: otter-go }
        # Region-deploy: read-side split lives only in values.yaml
        # because k3d Traefik can't honor the regex Prefix rules we
        # use to route /events vs /events/stream. On k3d the whole
        # /api/v1/region-deployments tree stays on Python until the
        # lifecycle PR collapses the split.
        # /api/v1/dashboards/* fully on otter-go after Phase 3. Single
        # Prefix rule supersedes the per-phase rules that lived here.
        - { path: /api/v1/dashboards, pathType: Prefix, backend: otter-go }
        # BGP module fully on otter-go (TCP-AO via PRs #203/#204; rest
        # was implemented on Go in PR 44 but dark until this cutover).
        - { path: /api/v1/bgp, pathType: Prefix, backend: otter-go }
        # Alerts module fully on otter-go (this PR). Python's eval
        # loop in services/alerts.py stays — only the HTTP routes move.
        - { path: /api/v1/alerts, pathType: Prefix, backend: otter-go }
        # PR 33 cutover: full /api/v1/dns/* on otter-go.
        - { path: /api/v1/dns, pathType: Prefix, backend: otter-go }
        # PR 18 cutover: all of /api/v1/ipam/* on otter-go.
        # supersedes the /api/v1/ipam/dhcp Prefix from PR 17 (still
        # routes to the same backend, just via the broader rule).
        # k3d Traefik couldn't honor the supernets/{id}/move regex
        # before; that endpoint joins the rest of IPAM here.
        - { path: /api/v1/ipam, pathType: Prefix, backend: otter-go }
        # Notifications fully on otter-go after the test endpoint port.
        - { path: /api/v1/notifications, pathType: Prefix, backend: otter-go }
        # PR 19 cutover: organization + stencils on otter-go.
        - { path: /api/v1/organizations, pathType: Prefix, backend: otter-go }
        - { path: /api/v1/stencils,      pathType: Prefix, backend: otter-go }
        # PR 20 cutover: /api/v1/power on otter-go.
        - { path: /api/v1/power,         pathType: Prefix, backend: otter-go }
        # PR 21 cutover: /api/v1/collectors on otter-go.
        - { path: /api/v1/collectors,    pathType: Prefix, backend: otter-go }
        # PR 22 cutover: /api/v1/ingest/telemetry JSON fallback on otter-go.
        - { path: /api/v1/ingest,        pathType: Prefix, backend: otter-go }
        # PR 33 cutover: /api/v1/dns/* fully on otter-go.
        - { path: /api/v1/dns,           pathType: Prefix, backend: otter-go }
        - { path: /api,              pathType: Prefix, backend: otter    }
        - { path: /,                 pathType: Prefix, backend: finch    }
  tls: []

monitoring:
  serviceMonitor:
    enabled: false

networkPolicy:
  enabled: false
