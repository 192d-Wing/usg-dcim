# Local k3d overrides — strips production assumptions (HA datastores,
# Prometheus operator, mTLS) so `helm install` succeeds on a laptop
# cluster started with:
#
#   k3d cluster create dcim --port "8080:80@loadbalancer"
#
# Pair with the public ghcr.io image tags built by CI.

global:
  image:
    registry: ghcr.io/192d-wing/usg-dcim
    pullPolicy: IfNotPresent
  postgresql:
    external: false
    dsn: "postgresql+asyncpg://dcim:dcim@postgres:5432/dcim"
  redis:
    external: false
    dsn: "redis://redis:6379/0"
  config:
    jwtSecret: "k3d-dev-only-not-for-prod"
    collectorTokenSecret: "k3d-dev-only-not-for-prod"

otter:
  replicaCount: 1
  autoscaling: { enabled: false }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }

otter-worker:
  replicaCount: 1
  autoscaling: { enabled: false }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }

heron:
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  mtls:
    enabled: false

finch:
  replicaCount: 1

# Single replica on k3d so a single-node cluster doesn't fail
# scheduling the second pod for the default PDB. PDB explicitly
# disabled — k3d drains would deadlock.
otter-go:
  replicaCount: 1
  podDisruptionBudget:
    enabled: false

magpie:
  enabled: false

beagle:
  enabled: false

ingress:
  enabled: true
  className: traefik
  # Traefik handles regex paths via IngressRoute CRD rather than nginx's
  # use-regex annotation. On k3d we rely on Prefix-only routing and
  # accept that /api/v1/ipam/supernets/{id}/move won't hit otter-go —
  # the LIR Unassigned-Move modal isn't load-bearing for local dev.
  hosts:
    - host: dcim.local
      paths:
        - { path: /api/v1/lir,       pathType: Prefix, backend: otter-go }
        - { path: /api/v1/auth,      pathType: Prefix, backend: otter-go }
        - { path: /api/v1/audit,     pathType: Prefix, backend: otter-go }
        - { path: /api/v1/telemetry, pathType: Prefix, backend: otter-go }
        - { path: /api/v1/admin,     pathType: Prefix, backend: otter-go }
        - { path: /api/v1/search,    pathType: Prefix, backend: otter-go }
        # Inventory module fully on otter-go after cables PATCH port.
        - { path: /api/v1/inventory,        pathType: Prefix, backend: otter-go }
        # Region-deploy: read-side split lives only in values.yaml
        # because k3d Traefik can't honor the regex Prefix rules we
        # use to route /events vs /events/stream. On k3d the whole
        # /api/v1/region-deployments tree stays on Python until the
        # lifecycle PR collapses the split.
        # /api/v1/dashboards/* fully on otter-go after Phase 3. Single
        # Prefix rule supersedes the per-phase rules that lived here.
        - { path: /api/v1/dashboards, pathType: Prefix, backend: otter-go }
        # TCP-AO key-chains + keys + rotate-batch (PRs #203 + this).
        # URL prefix is /bgp; capability namespace `routing:*` is
        # separate.
        - { path: /api/v1/bgp/tcp-ao-key-chains, pathType: Prefix, backend: otter-go }
        - { path: /api/v1/bgp/tcp-ao-keys,       pathType: Prefix, backend: otter-go }
        - { path: /api,              pathType: Prefix, backend: otter    }
        - { path: /,                 pathType: Prefix, backend: finch    }
  tls: []

monitoring:
  serviceMonitor:
    enabled: false

networkPolicy:
  enabled: false
