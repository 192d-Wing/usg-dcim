apiVersion: v2
name: dcim
description: |
  USG DCIM enterprise platform. Umbrella chart bundling per-animal
  subcharts (otter-go, otter-go-scheduler, finch, heron, magpie,
  beagle, badger) plus shared ingress, network policy, secrets, and
  schema migrations.
type: application
version: 0.3.0
appVersion: "0.3.0"
maintainers:
  - name: USG DCIM Team
keywords: [dcim, datacenter, infrastructure, monitoring]

# Subcharts under charts/ — declared so `helm lint` recognizes them.
# Each subchart's enabled flag is set in values.yaml (per-animal block).
dependencies:
  - { name: otter-go,           version: 0.1.0, condition: otter-go.enabled }
  - { name: otter-go-scheduler, version: 0.1.0, condition: otter-go-scheduler.enabled }
  - { name: finch,        version: 0.1.0, condition: finch.enabled }
  - { name: heron,        version: 0.1.0, condition: heron.enabled }
  - { name: magpie,       version: 0.1.0, condition: magpie.enabled }
  - { name: beagle,       version: 0.1.0, condition: beagle.enabled }
  - { name: badger,       version: 0.1.0, condition: badger.enabled }
