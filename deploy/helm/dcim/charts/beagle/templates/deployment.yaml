{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beagle.fullname" . }}
  labels: {{- include "beagle.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "beagle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "beagle.labels" . | nindent 8 }}
    spec:
      containers:
        - name: beagle
          image: {{ include "beagle.image" . }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - { name: admin, containerPort: {{ .Values.service.adminPort }} }
          env:
            - { name: DNS_PROBE_HEALTH_ADDR, value: ":{{ .Values.service.adminPort }}" }
            - { name: DCIM_POSTGRES_DSN_RAW, value: {{ regexReplaceAll "^postgresql\\+asyncpg" .Values.global.postgresql.dsn "postgres" | quote }} }
            - { name: DNS_PROBE_TICK,        value: {{ .Values.config.tick | quote }} }
            - { name: DNS_PROBE_CONCURRENCY, value: {{ .Values.config.concurrency | quote }} }
          securityContext:
            # The beagle image's USER is `probe` (uid 65532), which the
            # kubelet can't verify against the pod's runAsNonRoot policy
            # without an explicit numeric UID. Pin it here so probe runs
            # match the image's adduser uid.
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            {{- if .Values.capNetRaw }}
            capabilities:
              add: ["NET_RAW"]
              drop: ["ALL"]
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: admin }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "beagle.fullname" . }}
  labels: {{- include "beagle.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  # Headless: nothing should send live traffic to beagle — Service
  # exists for ServiceMonitor discovery and /healthz only.
  clusterIP: None
  ports:
    - { name: admin, port: {{ .Values.service.adminPort }}, targetPort: admin }
  selector: {{- include "beagle.selectorLabels" . | nindent 4 }}
{{- end }}
