apiVersion: v2
name: otter-go-scheduler
description: |
  USG DCIM Go cron-driven scheduler. Companion to the otter-go API
  subchart; runs the periodic jobs the retired Python arq worker
  historically owned. PR #208 landed the harness + the first ported
  job (dns_purge_metrics); subsequent PRs ported the rest.

  Same image as otter-go (multi-binary build via
  packages/otter-go/Containerfile). This subchart sets command to
  /otter-go-scheduler so the same release tag pins both the API
  and the scheduler.

type: application
version: 0.1.0
appVersion: "0.1.0"
maintainers:
  - name: USG DCIM Team
