{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "otter-go-scheduler.fullname" . }}
  labels: {{- include "otter-go-scheduler.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  # Headless: nothing sends live traffic to the scheduler — Service
  # exists for ServiceMonitor discovery + /healthz probes only. The
  # ipam_utilization_sweep job (PR ipam-util) emits Prometheus gauges
  # on /metrics; Prometheus discovers this pod via the ServiceMonitor.
  clusterIP: None
  ports:
    - { name: http, port: 8000, targetPort: http }
  selector: {{- include "otter-go-scheduler.selectorLabels" . | nindent 4 }}
{{- end }}
