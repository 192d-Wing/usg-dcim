{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "magpie.fullname" . }}
  labels: {{- include "magpie.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "magpie.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "magpie.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: magpie
          image: {{ include "magpie.image" . }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - { name: admin, containerPort: {{ .Values.service.adminPort }} }
          env:
            - { name: ALERTS_HEALTH_ADDR, value: ":{{ .Values.service.adminPort }}" }
            - { name: DCIM_POSTGRES_DSN_RAW, value: {{ .Values.global.postgresql.dsn | quote }} }
            - { name: DCIM_REDIS_DSN, value: {{ .Values.global.redis.dsn | quote }} }
            - { name: DCIM_COLLECTOR_STALE_SECONDS, value: {{ .Values.config.staleSeconds | quote }} }
            - { name: ALERTS_EVAL_INTERVAL,  value: {{ .Values.config.evalInterval | quote }} }
            - { name: ALERTS_SWEEP_INTERVAL, value: {{ .Values.config.sweepInterval | quote }} }
            - { name: ALERTS_MAX_PARALLEL,   value: {{ .Values.config.maxParallel | quote }} }
          readinessProbe:
            httpGet: { path: /healthz, port: admin }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "magpie.fullname" . }}
  labels: {{- include "magpie.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  # Headless: nothing should send live traffic to magpie — Service
  # exists for ServiceMonitor discovery and /healthz only.
  clusterIP: None
  ports:
    - { name: admin, port: {{ .Values.service.adminPort }}, targetPort: admin }
  selector: {{- include "magpie.selectorLabels" . | nindent 4 }}
{{- end }}
