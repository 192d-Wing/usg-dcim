enabled: true
replicaCount: 3
resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits:   { cpu: 2,    memory: 4Gi }
service:
  type: ClusterIP
  port: 8443
mtls:
  enabled: true
  # Server TLS secret containing tls.crt + tls.key (e.g. cert-manager output).
  # Must be present in the release namespace.
  serverCertSecret: dcim-heron-tls
  # CA bundle used to verify collector client certificates. Secret must
  # contain a `ca.crt` key.
  clientCABundleSecret: dcim-collector-ca
  # When true, a valid client cert is required (RequireAndVerifyClientCert).
  # When false, client certs are validated if presented but not required;
  # the bearer-token check still gates the request either way.
  requireClientCert: true
