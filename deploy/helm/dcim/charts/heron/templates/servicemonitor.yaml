{{- if and .Values.enabled .Values.global.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "heron.fullname" . }}
  namespace: {{ .Values.global.monitoring.serviceMonitor.namespace | default .Release.Namespace }}
  labels:
    {{- include "heron.labels" . | nindent 4 }}
    {{- with .Values.global.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels: {{- include "heron.selectorLabels" . | nindent 6 }}
  endpoints:
    # Plain-HTTP admin port — /metrics is mounted there, not on the
    # mTLS ingest port. See PR #63.
    - port: admin
      path: /metrics
      interval: {{ .Values.global.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.global.monitoring.serviceMonitor.scrapeTimeout }}
{{- end }}
