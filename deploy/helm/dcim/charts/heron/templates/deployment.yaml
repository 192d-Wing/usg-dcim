{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heron.fullname" . }}
  labels: {{- include "heron.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "heron.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "heron.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: heron
          image: {{ include "heron.image" . }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["uvicorn", "dcim.main:app", "--host", "0.0.0.0", "--port", "8443"]
          ports:
            - { name: https, containerPort: 8443 }
          env:
            - { name: DCIM_COLLECTOR_MTLS_REQUIRED, value: {{ .Values.mtls.enabled | quote }} }
            - { name: DCIM_POSTGRES_DSN, value: {{ .Values.global.postgresql.dsn | quote }} }
            - { name: DCIM_REDIS_DSN,    value: {{ .Values.global.redis.dsn | quote }} }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "heron.fullname" . }}
  labels: {{- include "heron.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: https
  selector: {{- include "heron.selectorLabels" . | nindent 4 }}
{{- end }}
