# Defaults — overridden by the umbrella's `otter:` block. Kept in sync
# so a `helm install charts/otter` (subchart standalone) still works.
enabled: true
replicaCount: 3
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits:   { cpu: 1,    memory: 2Gi }
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
service:
  type: ClusterIP
  port: 8000
