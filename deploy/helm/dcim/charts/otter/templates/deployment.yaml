{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "otter.fullname" . }}
  labels: {{- include "otter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "otter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "otter.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: otter
          image: {{ include "otter.image" . }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - { name: DCIM_POSTGRES_DSN, value: {{ .Values.global.postgresql.dsn | quote }} }
            - { name: DCIM_REDIS_DSN,    value: {{ .Values.global.redis.dsn | quote }} }
            - name: DCIM_JWT_SECRET
              valueFrom: { secretKeyRef: { name: dcim-secrets, key: jwt_secret } }
            - { name: DCIM_OIDC_ISSUER,    value: {{ .Values.global.config.oidc.issuer | quote }} }
            - { name: DCIM_OIDC_CLIENT_ID, value: {{ .Values.global.config.oidc.clientId | quote }} }
            - { name: DCIM_COLLECTOR_STALE_SECONDS, value: {{ .Values.global.config.collectorStaleSeconds | quote }} }
            {{- if .Values.global.otel.enabled }}
            - { name: DCIM_OTEL_ENABLED, value: "true" }
            - { name: DCIM_OTEL_EXPORTER_ENDPOINT, value: {{ .Values.global.otel.exporterEndpoint | quote }} }
            - { name: DCIM_OTEL_SERVICE_NAME, value: "dcim-otter" }
            - { name: DCIM_OTEL_ENVIRONMENT, value: {{ .Values.global.otel.environment | quote }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "otter.fullname" . }}
  labels: {{- include "otter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector: {{- include "otter.selectorLabels" . | nindent 4 }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "otter.fullname" . }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "otter.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
