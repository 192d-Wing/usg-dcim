{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "otter-go.fullname" . }}
  labels: {{- include "otter-go.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }
  selector: {{- include "otter-go.selectorLabels" . | nindent 4 }}
{{- end }}
