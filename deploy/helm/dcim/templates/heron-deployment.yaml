apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dcim.fullname" . }}-ingest
  labels:
    {{- include "dcim.labels" . | nindent 4 }}
    app.kubernetes.io/component: heron
spec:
  replicas: {{ .Values.heron.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: heron
  template:
    metadata:
      labels:
        {{- include "dcim.labels" . | nindent 8 }}
        app.kubernetes.io/component: heron
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: heron
          image: {{ include "dcim.image" (dict "Values" .Values "name" "otter") }}
          command: ["uvicorn", "dcim.main:app", "--host", "0.0.0.0", "--port", "8443"]
          ports:
            - { name: https, containerPort: 8443 }
          env:
            - { name: DCIM_COLLECTOR_MTLS_REQUIRED, value: {{ .Values.heron.mtls.enabled | quote }} }
            - { name: DCIM_POSTGRES_DSN, value: {{ .Values.postgresql.dsn | quote }} }
            - { name: DCIM_REDIS_DSN,    value: {{ .Values.redis.dsn | quote }} }
          resources:
            {{- toYaml .Values.heron.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dcim.fullname" . }}-ingest
spec:
  type: {{ .Values.heron.service.type }}
  ports:
    - port: {{ .Values.heron.service.port }}
      targetPort: https
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: heron
