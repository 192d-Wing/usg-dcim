{{/*
The finch container's nginx config proxies /api/ to upstream "api"
(packages/finch/nginx.conf line 21). The otter Python API subchart
was retired after the full Go cutover; finch still needs a Service
literally named `api` to resolve the upstream, so this template now
emits an alias pointing at otter-go's pods instead.

Selector matches the otter-go subchart's Deployment labels so the
Service routes traffic to the same pods otter-go's own Service does.
*/}}
{{- if (index .Values "otter-go" "enabled") }}
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {{- include "dcim.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: otter-go
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
