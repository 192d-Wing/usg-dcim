{{/*
The finch container's nginx config proxies /api/ to upstream "api"
(packages/finch/nginx.conf line 21). The otter subchart's Service
name is derived from `{{ include "otter.fullname" . }}` (e.g.
"dcim-otter"), so without this alias finch crashes at startup with
`host not found in upstream "api"`.

Emit a stable Service literally named `api` that selects otter pods.
Same selector labels as the otter subchart's Service so it points at
the same set of pods.
*/}}
{{- if .Values.otter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {{- include "dcim.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.otter.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: otter
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
