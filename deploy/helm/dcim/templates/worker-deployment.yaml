apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dcim.fullname" . }}-worker
  labels:
    {{- include "dcim.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "dcim.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "dcim.image" (dict "Values" .Values "name" "api") }}
          command: ["arq", "dcim.worker.WorkerSettings"]
          env:
            - { name: DCIM_POSTGRES_DSN, value: {{ .Values.postgresql.dsn | quote }} }
            - { name: DCIM_REDIS_DSN,    value: {{ .Values.redis.dsn | quote }} }
            {{- if .Values.otel.enabled }}
            - { name: DCIM_OTEL_ENABLED, value: "true" }
            - { name: DCIM_OTEL_EXPORTER_ENDPOINT, value: {{ .Values.otel.exporterEndpoint | quote }} }
            - { name: DCIM_OTEL_SERVICE_NAME, value: "dcim-worker" }
            - { name: DCIM_OTEL_ENVIRONMENT, value: {{ .Values.otel.environment | quote }} }
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if .Values.worker.capNetRaw }}
          # NET_RAW lets the worker open ICMP sockets for the DNS
          # health-check engine's icmp protocol. Drop everything
          # else so the container's posture stays narrow.
          securityContext:
            capabilities:
              add: ["NET_RAW"]
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          {{- end }}
