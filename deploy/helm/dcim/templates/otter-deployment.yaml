apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dcim.fullname" . }}-api
  labels:
    {{- include "dcim.labels" . | nindent 4 }}
    app.kubernetes.io/component: otter
spec:
  replicas: {{ .Values.otter.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: otter
  template:
    metadata:
      labels:
        {{- include "dcim.labels" . | nindent 8 }}
        app.kubernetes.io/component: otter
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: otter
          image: {{ include "dcim.image" (dict "Values" .Values "name" "otter") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - { name: DCIM_POSTGRES_DSN, value: {{ .Values.postgresql.dsn | quote }} }
            - { name: DCIM_REDIS_DSN,    value: {{ .Values.redis.dsn | quote }} }
            - name: DCIM_JWT_SECRET
              valueFrom: { secretKeyRef: { name: dcim-secrets, key: jwt_secret } }
            - { name: DCIM_OIDC_ISSUER,    value: {{ .Values.config.oidc.issuer | quote }} }
            - { name: DCIM_OIDC_CLIENT_ID, value: {{ .Values.config.oidc.clientId | quote }} }
            - { name: DCIM_COLLECTOR_STALE_SECONDS, value: {{ .Values.config.collectorStaleSeconds | quote }} }
            {{- if .Values.otel.enabled }}
            - { name: DCIM_OTEL_ENABLED, value: "true" }
            - { name: DCIM_OTEL_EXPORTER_ENDPOINT, value: {{ .Values.otel.exporterEndpoint | quote }} }
            - { name: DCIM_OTEL_SERVICE_NAME, value: "dcim-otter" }
            - { name: DCIM_OTEL_ENVIRONMENT, value: {{ .Values.otel.environment | quote }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.otter.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dcim.fullname" . }}-api
  labels:
    {{- include "dcim.labels" . | nindent 4 }}
    app.kubernetes.io/component: otter
spec:
  type: {{ .Values.otter.service.type }}
  ports:
    - port: {{ .Values.otter.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: otter
{{- if .Values.otter.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "dcim.fullname" . }}-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "dcim.fullname" . }}-api
  minReplicas: {{ .Values.otter.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.otter.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.otter.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
