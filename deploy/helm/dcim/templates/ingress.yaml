{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dcim.fullname" . }}
  labels: {{- include "dcim.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: {{- toYaml .Values.ingress.tls | nindent 4 }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ if eq .backend "otter-go" }}{{ include "otter-go.fullname" $ }}{{ else }}{{ include "dcim.subchartService" (dict "ctx" $ "name" .backend) }}{{ end }}
                port:
                  number: {{ if eq .backend "otter" }}{{ $.Values.otter.service.port }}{{ else if eq .backend "otter-go" }}{{ (index $.Values "otter-go").service.port }}{{ else }}{{ $.Values.finch.service.port }}{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
