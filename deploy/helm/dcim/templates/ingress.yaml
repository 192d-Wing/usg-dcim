{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dcim.fullname" . }}
  labels: {{- include "dcim.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: {{- toYaml .Values.ingress.tls | nindent 4 }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                # Subchart convention: Service name {Release.Name}-{subchart},
                # port from .Values.<subchart>.service.port. `index` is used
                # because `.Values.otter-go.x` parses as subtraction. Unknown
                # backend → template error at render time.
                name: {{ printf "%s-%s" $.Release.Name .backend }}
                port:
                  number: {{ index $.Values .backend "service" "port" }}
          {{- end }}
    {{- end }}
{{- end }}
