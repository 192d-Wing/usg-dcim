# RFC 9432 smoke-test overlay: BIND 9 secondary consuming the DCIM catalog zone.
#
# Usage:
#   docker compose -p site42 \
#     -f deploy/docker/site-dns/docker-compose.yml \
#     -f deploy/docker/site-dns/docker-compose.bind9.yml \
#     up -d bind9-smoke
#
# The container joins dns-net so it can reach coredns-auth at 172.30.42.10.
# BIND's cache dir is an ephemeral volume — zone files provisioned from the
# catalog survive restarts but are discarded on `docker compose down -v`.
#
# CATALOG_ZONE env var overrides the zone name if your fabric uses a
# non-default apex (defaults to catalog.prod.dcim.local).

services:
  bind9-smoke:
    image: internetsystemsconsortium/bind9:9.20
    environment:
      CATALOG_ZONE: ${CATALOG_ZONE:-catalog.prod.dcim.local}
      TZ: UTC
    # Substitute the catalog zone name into named.conf at container start.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chown bind:bind /var/cache/bind
        sed "s/CATALOG_ZONE_PLACEHOLDER/$${CATALOG_ZONE}/g" \
          /etc/bind/named.conf.dcim > /etc/bind/named.conf.local
        exec named -g -u bind -c /etc/bind/named.conf.local
    volumes:
      - ./bind9-smoke/named.conf:/etc/bind/named.conf.dcim:ro
      - bind9-cache:/var/cache/bind
    networks:
      dns-net:
        ipv4_address: 172.30.42.50
    restart: unless-stopped

volumes:
  bind9-cache:

networks:
  dns-net:
    external: true
    name: site42_dns-net
