kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # HTTP — redirect to HTTPS
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS — dcim.prod.dev.mil / keycloak.prod.dev.mil / dns.prod.dev.mil DoH
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # QUIC / DNS-over-QUIC on 443 UDP
      - containerPort: 443
        hostPort: 443
        protocol: UDP
      # DNS TCP — 5353 avoids conflict with WSL's internal DNS resolver on 53
      - containerPort: 53
        hostPort: 5353
        protocol: TCP
      # DNS UDP
      - containerPort: 53
        hostPort: 5353
        protocol: UDP
