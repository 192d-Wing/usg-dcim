apiVersion: apps/v1
kind: Deployment
metadata:
  name: magpie
  namespace: dcim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: magpie
  template:
    metadata:
      labels:
        app: magpie
    spec:
      containers:
        - name: magpie
          image: localhost/dcim-magpie:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DCIM_POSTGRES_DSN_RAW
              value: postgres://dcim:dcim@postgres:5432/dcim
            - name: DCIM_REDIS_DSN
              value: redis://redis:6379/0
            - name: DCIM_TELEMETRY_INDEX_PREFIX
              value: dcim-telemetry
            - name: DCIM_COLLECTOR_STALE_SECONDS
              value: "600"
            - name: ALERTS_EVAL_INTERVAL
              value: 30s
            - name: ALERTS_SWEEP_INTERVAL
              value: 30s
            - name: ALERTS_MAX_PARALLEL
              value: "16"
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 1000m
