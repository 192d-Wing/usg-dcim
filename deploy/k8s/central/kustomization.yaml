apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dcim

resources:
  - 00-namespace.yaml
  - 01-pvc.yaml
  - 02-secrets.yaml
  - 03-configmaps.yaml
  - postgres.yaml
  - redis.yaml
  - keycloak.yaml
  - otter.yaml
  - worker.yaml
  - finch.yaml
  - heron.yaml
  - magpie.yaml
  - beagle.yaml
  - nginx-proxy.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: dcim-central
      app.kubernetes.io/version: dev
    includeSelectors: false
