apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dcim

resources:
  - 00-namespace.yaml
  - 01-pvc.yaml
  - 02-secrets.yaml
  - 03-configmaps.yaml
  - postgres.yaml
  - redis.yaml
  - keycloak.yaml
  - api.yaml
  - worker.yaml
  - frontend.yaml
  - go-ingest.yaml
  - go-alerts.yaml
  - go-dns-probe.yaml
  - nginx-proxy.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: dcim-central
      app.kubernetes.io/version: dev
    includeSelectors: false
