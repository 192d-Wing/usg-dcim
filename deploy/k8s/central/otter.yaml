apiVersion: v1
kind: Service
metadata:
  name: otter
  namespace: dcim
spec:
  selector:
    app: otter
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30000
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otter
  namespace: dcim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otter
  template:
    metadata:
      labels:
        app: otter
    spec:
      containers:
        - name: otter
          image: localhost/dcim-otter:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DCIM_ENV
              value: dev
            - name: DCIM_LOG_JSON
              value: "false"
            - name: DCIM_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: postgres-dsn
            - name: DCIM_REDIS_DSN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: redis-dsn
            - name: DCIM_CORS_ORIGINS
              value: '["https://dcim.prod.dev.mil","http://localhost:5173"]'
            - name: DCIM_COLLECTOR_MTLS_REQUIRED
              value: "false"
            # Internal HTTP URL for discovery only — avoids TLS issues inside the cluster.
            # The discovered doc's issuer/endpoints still point to the external HTTPS URL.
            - name: DCIM_OIDC_ISSUER
              value: http://keycloak:8080/realms/dcim
            - name: DCIM_OIDC_CLIENT_ID
              value: dcim-spa
            - name: DCIM_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: oidc-client-secret
            - name: DCIM_OIDC_REDIRECT_URI
              value: https://dcim.prod.dev.mil/login/callback
            - name: DCIM_DNS_DNSSEC_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: dnssec-secret
            - name: DCIM_DNS_HICKORY_DOT_ENABLED
              value: "false"
            - name: DCIM_DNS_HICKORY_DOH_ENABLED
              value: "false"
            - name: DCIM_DNS_HICKORY_ALLOW_NETWORKS_STRICT
              value: "false"
            - name: DCIM_OIDC_VERIFY_SSL
              value: "false"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 1000m
      # Resolve external hostnames to internal ClusterIPs so the API
      # can reach Keycloak for OIDC discovery without leaving the cluster.
      # Route external hostnames to in-cluster services.
      # Keycloak → nginx-proxy so HTTPS back-channel calls work without
      # leaving the cluster. DCIM_OIDC_VERIFY_SSL=false handles the
      # self-signed cert on nginx-proxy.
      hostAliases:
        - ip: "10.96.159.255"
          hostnames:
            - keycloak.prod.dev.mil
      initContainers:
        - name: wait-postgres
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -z postgres:5432; do echo waiting for postgres; sleep 2; done;']
