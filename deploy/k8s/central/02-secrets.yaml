apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: dcim
type: Opaque
stringData:
  username: dcim
  password: dcim
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: dcim
type: Opaque
stringData:
  oidc-client-secret: dev-secret-change-me
  dnssec-secret: ""
  redis-dsn: redis://redis:6379/0
  postgres-dsn: postgresql+asyncpg://dcim:dcim@postgres:5432/dcim
  # HMAC secret used to derive per-deployment kubeconfig-callback
  # bootstrap tokens (see dcim.regiondeploy.tokens). Required for
  # the region-deploy flow — when unset, the callback endpoint
  # fails closed with 503. Dev-only placeholder here; production
  # must replace via External Secrets / sealed-secrets.
  regiondeploy-callback-secret: dev-callback-secret-change-me
