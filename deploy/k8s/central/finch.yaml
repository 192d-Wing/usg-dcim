apiVersion: v1
kind: Service
metadata:
  name: finch
  namespace: dcim
spec:
  selector:
    app: finch
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finch
  namespace: dcim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finch
  template:
    metadata:
      labels:
        app: finch
    spec:
      containers:
        - name: finch
          image: localhost/dcim-finch:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
