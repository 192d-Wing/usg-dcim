# icam Keycloak — dev SSO / IdP for the DCIM 'dcim' realm.
#
# NOTE: runs `start-dev` on the embedded H2 database with NO PersistentVolume.
# The realm is re-imported from the keycloak-realm ConfigMap on every restart
# (see keycloak-realm.configmap.yaml), so that ConfigMap is the source of truth
# for realm/clients/roles — a live `kcadm` edit is lost on restart. This is a
# DEV configuration (Keycloak logs "DO NOT use this in production"); a real
# deployment needs an external DB (KC_DB) + persistence + `start` (not start-dev).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: icam
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0
          imagePullPolicy: IfNotPresent
          args:
            - start-dev
            - --import-realm
            - --http-port=8080
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            - name: KC_HOSTNAME
              value: http://icam.xtic.dev.mil
            - name: KC_HOSTNAME_ADMIN
              value: http://icam.xtic.dev.mil
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_BACKCHANNEL
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /health/started
              port: health
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 180
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm
            items:
              - key: dcim-realm.json
                path: dcim-realm.json
