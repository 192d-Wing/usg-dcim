# Keycloak realm import for the dev 'dcim' realm on the shared icam Keycloak
# (k8-01.xtic.dev.mil, namespace icam). Mounted at /opt/keycloak/data/import
# and loaded via `start-dev --import-realm`. The icam Keycloak runs on an
# ephemeral H2 DB (no PVC), so this ConfigMap is the source of truth across
# pod restarts — any realm change must land here, not just via kcadm.
#
# The `realm roles` protocol mapper on dcim-spa has id.token.claim=true so
# realm_access.roles reaches the ID TOKEN; otter-go's OIDC callback reads
# roles from the id_token, and without this the SPA resolves zero
# capabilities and finch hides every cap-gated menu.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: icam
data:
  dcim-realm.json: |
    {
      "realm": "dcim",
      "enabled": true,
      "displayName": "USG DCIM",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "sslRequired": "none",
      "accessTokenLifespan": 600,
      "ssoSessionIdleTimeout": 1800,
      "clients": [
        {
          "clientId": "dcim-spa",
          "name": "DCIM API + SPA",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "xJWn0xuZKNBPqod8229o5hpTXPZTGcbE3TAdayOqVA",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "https://dcim.xtic.dev.mil/*",
            "https://dcim.xtic.dev.mil/login/callback",
            "http://dcim.xtic.dev.mil/*",
            "http://dcim.xtic.dev.mil/login/callback",
            "http://localhost:5173/*",
            "http://localhost:8000/api/v1/auth/oidc/callback*"
          ],
          "webOrigins": [
            "https://dcim.xtic.dev.mil",
            "http://dcim.xtic.dev.mil",
            "http://localhost:5173",
            "http://localhost:8000"
          ],
          "attributes": {
            "post.logout.redirect.uris": "https://dcim.xtic.dev.mil/*##http://dcim.xtic.dev.mil/*##http://localhost:5173/*"
          },
          "protocolMappers": [
            {
              "name": "realm roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "realm_access.roles",
                "jsonType.label": "String",
                "multivalued": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "username": "operator",
          "enabled": true,
          "email": "operator@xtic.dev.mil",
          "emailVerified": true,
          "firstName": "DCIM",
          "lastName": "Operator",
          "credentials": [
            {
              "type": "password",
              "value": "operator",
              "temporary": false
            }
          ],
          "realmRoles": [
            "dcim-admin"
          ]
        }
      ],
      "roles": {
        "realm": [
          {
            "name": "dcim-admin",
            "description": "Full DCIM admin (idp role)"
          },
          {
            "name": "dcim-reader",
            "description": "Read-only DCIM access"
          }
        ]
      }
    }
