# TEMPLATE — do NOT commit real credentials. This is the Keycloak *master realm*
# console admin (KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD). The DCIM app SSO flow
# does NOT use these — application identities (the `operator` user, the `dcim-spa`
# client secret) come from keycloak-realm.configmap.yaml. These creds are only for
# the Keycloak admin console / kcadm.
#
# This file is intentionally EXCLUDED from kustomization.yaml so `apply -k` can't
# clobber an existing cluster's admin password. Create the real secret out-of-band:
#
#   kubectl -n icam create secret generic keycloak-admin \
#     --from-literal=username=admin \
#     --from-literal=password='<choose-a-strong-password>'
#
# (or manage via sealed-secrets / SOPS). On the existing k8-01 cluster this secret
# already exists — leave it alone.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: icam
type: Opaque
stringData:
  username: admin
  password: CHANGE_ME_DEV_ONLY
