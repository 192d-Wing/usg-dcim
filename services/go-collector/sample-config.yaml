# Minimum config the Phase-1 go-collector accepts. Identical surface
# to the Python collector's sample-config.yaml so an operator can
# point the same file at either binary.
collector_id: 00000000-0000-0000-0000-0000000000aa
site_id: 00000000-0000-0000-0000-0000000000bb

# Heartbeat + DNS bundle polling + health-check posts go here.
ingest_url: http://api:8000

# Telemetry batches go here. Defaults to ingest_url when unset; set
# this to point telemetry at services/go-ingest while leaving the
# rest of the API surface on the Python stack.
telemetry_url: http://go-ingest.infra.prod.dcim.mil:8100

heartbeat_interval_seconds: 30
buffer_path: /var/lib/dcim-collector/buffer.db

# Mounted file containing a dcim_<token> with collectors:ingest:write.
# Whitespace is trimmed so `echo $token > /run/secrets/dcim_token`
# works without further ceremony.
api_token_file: /run/secrets/dcim_token

devices:
  # Phase 1 only registers stub drivers — every Poll() logs a
  # "driver_poll_stub" line. Phase 2 replaces these with real
  # SNMP + Redfish implementations without changing this config.
  - asset_id: 00000000-0000-0000-0000-0000000000cc
    kind: server
    driver: snmp
    poll_interval_seconds: 30
    snmp:
      host: snmpsim
      port: 1161
      community: public
      version: "2c"
      oids:
        sys.uptime.ticks: 1.3.6.1.2.1.1.3.0
