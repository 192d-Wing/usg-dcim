replicaCount: 3
image:
  repository: coredns/coredns
  tag: 1.12.0
service:
  type: LoadBalancer
  ipFamilies:
  - IPv6
  ipFamilyPolicy: SingleStack
servers:
- zones:
  - zone: .
  port: 53
  plugins:
  - name: errors
  - name: health
  - name: ready
  - name: prometheus
    parameters: 0.0.0.0:9153
  - name: file
    parameters: /etc/coredns/zones/db.region
dcim:
  deployment_id: 11111111-1111-1111-1111-111111111111
