version: "2"
sql:
  - engine: postgresql
    queries: queries
    schema:
      # Goose owns the schema after the alembic rip (PR #277). For
      # local regeneration, run the migrate binary against any
      # Postgres, then pg_dump the schema and refresh schema.sql:
      #   go run ./cmd/otter-go-migrate -cmd up
      #   pg_dump -s -O -x -d "$DCIM_POSTGRES_DSN" > db/schema.sql
      #   cd db && sqlc generate
      # schema.sql is gitignored — sqlc only validates locally for
      # now. The CI sqlc-drift job was retired because the original
      # alembic-dump workflow it depended on never landed; the
      # Postgres-in-CI replacement is a follow-up.
      - schema.sql
    gen:
      go:
        package: dbq
        out: generated
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_db_tags: false
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: jsonb
            go_type:
              type: "[]byte"
