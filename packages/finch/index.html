<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <title>USG DCIM</title>
    <!--
      Boot-time diagnostic. If the SPA module bundle throws during top-level
      evaluation (the React error boundary can't catch that), this handler
      writes the error to #root so the operator doesn't stare at a blank page.
      Cleared by main.tsx as soon as the React tree mounts.
    -->
    <script>
      (function () {
        function show(label, msg, stack) {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="padding:24px;font-family:ui-sans-serif,system-ui;color:#f5f5f5;background:#0b0d10;min-height:100vh">' +
              '<h1 style="font-size:20px;font-weight:600">USG DCIM — boot error</h1>' +
              '<p style="color:#fca5a5;margin-top:8px">' + label + ': ' + msg + '</p>' +
              (stack ? '<pre style="margin-top:16px;padding:12px;background:#1a1d23;border-radius:6px;font-size:12px;overflow-x:auto;white-space:pre-wrap">' + stack + '</pre>' : '') +
              '<p style="margin-top:24px;color:#9ca3af;font-size:12px">' +
                'Open DevTools console for the full trace. Try clearing localStorage keys ' +
                '<code>dcim.token</code> and <code>dcim.identity</code>, then hard-refresh.' +
              '</p>' +
            '</div>';
        }
        // Benign warnings emitted by ResizeObserver loops (Cloudscape and
        // many other layout libraries trigger these during normal
        // operation). They aren't fatal — swallow before the boot
        // handler treats the page as crashed.
        function isBenign(msg) {
          var m = String(msg || '');
          return m.indexOf('ResizeObserver loop') === 0
            || m.indexOf('ResizeObserver loop completed') !== -1
            || m.indexOf('ResizeObserver loop limit exceeded') !== -1;
        }
        window.addEventListener('error', function (e) {
          var msg = String(e.message || (e.error && e.error.message) || 'unknown');
          if (isBenign(msg)) return;
          var stack = e.error && e.error.stack ? String(e.error.stack) : '';
          show('error', msg, stack);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason || {};
          var msg = String(r.message || r);
          if (isBenign(msg)) return;
          show('unhandledrejection', msg, String(r.stack || ''));
        });
      })();
    </script>
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
