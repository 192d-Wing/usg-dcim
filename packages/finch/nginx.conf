server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable. Never fall back to index.html on a miss
    # — a 404 surfaces stale chunk references in the operator's browser
    # instead of silently returning HTML that the JS runtime tries to
    # execute (which throws confusingly during chunk eval).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        # In Kubernetes the api Service has a stable ClusterIP so
        # caching the address at startup is fine — no resolver trick needed.
        # In Docker Compose, add `resolver 127.0.0.11 valid=10s ipv6=off;`
        # above this block if you recreate the api container frequently.
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Console embed: the gateway proxy rebuilds request headers from an
        # allow-list and adds its signed assertion. nginx forwards client
        # headers by default; these are pinned explicitly so a later
        # proxy_set_header change cannot silently drop them. otter-go
        # (not nginx) verifies the assertion and the CSRF header.
        proxy_set_header X-Console-Assertion $http_x_console_assertion;
        proxy_set_header X-Console-Scope $http_x_console_scope;
        proxy_set_header X-DCIM-CSRF $http_x_dcim_csrf;
    }

    # Console embed: the gateway serves this tool under /t/dcim/ and passes
    # the path through verbatim. Strip the prefix internally so the
    # /assets/, /api/ and SPA locations below handle it unchanged
    # (/t/dcim/api/v1/x -> otter-go /api/v1/x). Build with VITE_BASE=/t/dcim/.
    location /t/dcim/ {
        rewrite ^/t/dcim(/.*)$ $1 last;
    }

    # /_console/* is answered by the console gateway in front of us; never
    # serve the SPA shell for it (the SDK would misread it as a context).
    location /_console/ {
        return 404;
    }

    # SPA shell. Never cache index.html so a deploy is picked up on
    # the next refresh — without this, browsers cling to old chunk
    # hashes after a frontend image rebuild.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
