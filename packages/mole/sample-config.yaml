# Sample collector configuration. Copy to /etc/dcim/collector.yaml.
collector_id: 00000000-0000-0000-0000-000000000001
site_id: 00000000-0000-0000-0000-000000000001
ingest_url: https://localhost:8443
heartbeat_interval_seconds: 30
buffer_path: /var/lib/dcim-collector/buffer.db
mtls:
  enabled: true
  client_cert: /etc/dcim/certs/client.crt
  client_key: /etc/dcim/certs/client.key
  ca_bundle: /etc/dcim/certs/ca.crt
api_token_file: /etc/dcim/collector.token

devices:
  - asset_id: 00000000-0000-0000-0000-000000001001
    kind: pdu
    driver: snmp
    poll_interval_seconds: 30
    snmp:
      host: 10.10.0.10
      community: public
      version: 2c
      oids:
        pdu.input.kw: 1.3.6.1.4.1.318.1.1.12.1.16.0
        pdu.input.amps: 1.3.6.1.4.1.318.1.1.12.1.16.1

  - asset_id: 00000000-0000-0000-0000-000000001002
    kind: server
    driver: redfish
    poll_interval_seconds: 60
    redfish:
      base_url: https://10.10.0.20
      username: root
      password_ref: secret://idrac/root
      verify_tls: true

  - asset_id: 00000000-0000-0000-0000-000000001003
    kind: crac
    driver: modbus
    poll_interval_seconds: 30
    modbus:
      host: 10.10.0.30
      port: 502
      unit_id: 1
      registers:
        crac.return.tempC: { address: 100, type: input_register, scale: 0.1 }
        crac.supply.tempC: { address: 101, type: input_register, scale: 0.1 }
