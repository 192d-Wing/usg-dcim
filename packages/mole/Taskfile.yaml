version: '3'

# Tasks for the mole package (legacy Python collector, deprecated — see
# DEPRECATED.md). Active collector lives in packages/badger/.

tasks:
  run:
    desc: Run the sample collector against the local stack
    dir: ../..
    cmds:
      - uv run --project packages/mole dcim-collector --config packages/mole/sample-config.yaml

  lint:
    desc: Run ruff check (warns only — no rules configured)
    dir: ../..
    cmds:
      - uv run --project packages/mole ruff check packages/mole || echo "ruff check skipped"
