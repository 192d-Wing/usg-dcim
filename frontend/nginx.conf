server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable. Never fall back to index.html on a miss
    # — a 404 surfaces stale chunk references in the operator's browser
    # instead of silently returning HTML that the JS runtime tries to
    # execute (which throws confusingly during chunk eval).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API proxy. Use Docker's embedded DNS (127.0.0.11) with a short
    # TTL and put the upstream in a variable — that forces nginx to
    # re-resolve per request instead of caching the api container's
    # IP at startup. Without this, recreating the api container leaves
    # nginx with a stale IP and the proxy returns 502 until the
    # frontend container is also restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $api_upstream "http://api:8000";
        proxy_pass $api_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA shell. Never cache index.html so a deploy is picked up on
    # the next refresh — without this, browsers cling to old chunk
    # hashes after a frontend image rebuild.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
