server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable. Never fall back to index.html on a miss
    # — a 404 surfaces stale chunk references in the operator's browser
    # instead of silently returning HTML that the JS runtime tries to
    # execute (which throws confusingly during chunk eval).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API proxy
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA shell. Never cache index.html so a deploy is picked up on
    # the next refresh — without this, browsers cling to old chunk
    # hashes after a frontend image rebuild.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
