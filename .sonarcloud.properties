# SonarCloud AUTOMATIC ANALYSIS configuration.
#
# This project is analyzed by SonarCloud's automatic analysis (the
# GitHub App), which reads THIS file — .sonarcloud.properties — from
# the analyzed branch. sonar-project.properties is only consulted by
# CI-based scanners and has demonstrably never applied here (main
# still carries indexed measures for db/generated and migrations
# despite the exclusions declared there since onboarding).
#
# Scope rationale (mirrors sonar-project.properties):
# * migrations use intentional schema-surgery patterns SQL linters
#   flag as bugs; the goose parser test is their correctness check.
# * db/generated is sqlc output, drift-gated against db/queries in CI
#   (ci.yml sqlc-drift job) — machine-written, not reviewable code.
# * templates.gen.json is a byte-identical build-time copy of the
#   canonical NIC schema.
sonar.exclusions=packages/otter-go/cmd/otter-go-migrate/migrations/**,packages/otter-go/db/generated/**,packages/finch/src/nic/templates.gen.json,**/vendor/**,**/node_modules/**,**/*.pb.go

# The sqlc config and query files are structurally repetitive by
# nature (per-enum override blocks, per-table CRUD queries) — keep
# them out of the copy-paste detector so the duplication gate
# measures hand-written code only.
# Test files are excluded too: table-driven tests repeat
# request/assert blocks by design.
sonar.cpd.exclusions=packages/otter-go/db/**,**/*_test.go
