# SonarCloud project configuration.
#
# Onboarding was done via the SonarCloud GitHub App, which auto-detects
# project structure. The settings below are local overrides — anything
# not set here picks up the org-default from sonarcloud.io.

sonar.projectKey=192d-Wing_usg-dcim
sonar.organization=192d-wing

# Source/test layout — let auto-detect handle most of it, just exclude
# generated + vendored + migration files.
#
# Schema migrations frequently use intentional "anti-patterns" that
# general SQL linters flag as bugs:
#   * DELETE FROM <table>;        (full-table wipe before column
#                                  restructuring — see e.g. PR #277's
#                                  0013_bgp_peer_asn_fks_drop_md5.sql)
#   * Hardcoded UUIDs / values    (seed rows for system roles, default
#                                  pools, lir-unassigned fabric, etc.)
#   * Dollar-quoted PL/pgSQL      (DO blocks, CREATE FUNCTION bodies —
#                                  SonarCloud's SQL parser can't reach
#                                  into these)
# These are correct in the migration context but light up red on
# Sonar's "Reliability" axis, dragging the new-code quality gate to E.
# Exclude the migrations directory from scans entirely; the goose
# parser-level test in packages/otter-go/cmd/otter-go-migrate/ is the
# canonical correctness check for these files.
# templates.gen.json is a build-time copy of the canonical NIC template schema
# (packages/otter-go/internal/nicreg/templates.json), synced by
# scripts/sync-nic-schema.mjs. It is byte-identical to the source, so the
# copy-paste detector counts the whole file as duplicated new code. Exclude the
# generated copy the same way db/generated is excluded.
sonar.exclusions=packages/otter-go/cmd/otter-go-migrate/migrations/**,packages/otter-go/db/generated/**,packages/finch/src/nic/templates.gen.json,**/vendor/**,**/node_modules/**,**/*.pb.go

# The sqlc config and query files are structurally repetitive by
# nature (per-enum override blocks, per-table CRUD queries) — keep
# them out of the copy-paste detector so the duplication gate
# measures hand-written code only.
sonar.cpd.exclusions=packages/otter-go/db/**
